<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher</title><style>
:root{
  --blue:#2563eb;--blue-dark:#1d4ed8;--blue-soft:#eff6ff;
  --maroon:#7f1d2d;--maroon-dark:#641624;--maroon-soft:#fff1f2;
  --ink:#172033;--muted:#667085;--line:#e5e7eb;--bg:#f7f9fc;
  --white:#fff;--danger:#b42318;--ok:#15803d;--shadow:0 8px 28px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topin{max-width:1440px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:240px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);margin-top:2px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 70px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px}
.side button{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:10px;color:#475467;margin-bottom:5px;font-weight:600;transition:.15s}
.side button.active,.side button:hover{background:var(--blue-soft);color:var(--blue);font-weight:700}
.main{padding:28px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2,.card h3{margin-top:0;letter-spacing:-.02em}
.card h2{font-size:20px}.card h3{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:700;color:#475467}
.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.10)}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:700;transition:.15s}
.btn:hover{background:var(--blue-dark);transform:translateY(-1px)}
.btn.secondary{background:#eef2f7;color:#344054}.btn.secondary:hover{background:#e4e9f0}
.btn.maroon{background:var(--maroon)}.btn.maroon:hover{background:var(--maroon-dark)}
.btn.danger{background:var(--danger)}.btn.success{background:var(--ok)}
.btn.small{padding:8px 11px;font-size:12px;border-radius:8px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stat strong{font-size:28px;display:block;margin-top:5px;letter-spacing:-.03em}
.muted{color:var(--muted)}
.notice{padding:13px 15px;border-radius:11px;background:var(--blue-soft);border:1px solid #bfdbfe;margin:0 0 14px}
.notice.warn{background:#fffbeb;border-color:#fde68a}.notice.error{background:var(--maroon-soft);border-color:#fecdd3;color:#881337}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.table{width:100%;border-collapse:collapse;background:#fff}
.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
.table th{background:#f8fafc;color:#475467;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fafcff}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2f7;color:#475467}
.pill.ok{background:#ecfdf3;color:#166534}.pill.bad{background:var(--maroon-soft);color:#9f1239}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line)}
.switch input{width:18px;height:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef6ff 0%,#fff 55%,#fff5f6 100%)}
.loginbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 22px 70px rgba(15,23,42,.12)}
.loginbox h1{margin:0 0 6px;font-size:26px;letter-spacing:-.04em}.loginbox .muted{margin-top:0}
.login-accent{height:5px;width:64px;background:linear-gradient(90deg,var(--blue),var(--maroon));border-radius:99px;margin-bottom:20px}
.hidden{display:none!important}
.search{max-width:420px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.section-title h2{margin:0}.section-title p{margin:5px 0 0;color:var(--muted)}
.edit-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #bfdbfe;background:var(--blue-soft);border-radius:11px;margin-bottom:16px;color:#1e3a8a}
.grade-input{min-width:78px;text-align:center;font-weight:700}
.report{background:#fff;color:#111;padding:30px;width:100%;max-width:900px;margin:auto;border:1px solid #ddd}
.report header{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--maroon);padding-bottom:10px}
.report h2{margin:4px 0;font-size:18px}.report table{width:100%;border-collapse:collapse;margin:12px 0}
.report th,.report td{border:1px solid #777;padding:6px;font-size:11px}.report th{background:#f3f4f6}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px;text-align:center}.sig div{border-top:1px solid #333;padding-top:5px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.show{display:flex}.modalbox{background:#fff;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:5px;padding:10px}.side button{min-width:max-content;width:auto}.grid,.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.topin{padding:12px 15px;flex-wrap:wrap}.brand{min-width:0}.top-actions{width:100%;margin-left:0}.grid,.grid2,.stats{grid-template-columns:1fr}.main{padding:14px}.card{padding:17px}.sig{grid-template-columns:1fr}.report{padding:16px}.loginbox{padding:24px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head><body><div class="login" id="login"><div class="loginbox"><h1 data-school-name>School Portal</h1><p class="muted">Teacher Portal</p><div class="field"><label>Teacher ID</label><input id="tid" placeholder="T-0001"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="tp" type="password"></div><button class="btn" style="margin-top:14px;width:100%" id="tlogin">Sign in</button><p id="lm" class="notice hidden"></p></div></div><div id="app" class="hidden"><div class="top"><div class="topin"><div class="brand"><div><b>Teacher Portal</b><small data-school-name></small></div></div><button class="btn secondary" id="logout">Logout</button></div></div><div class="layout"><aside class="side"><button class="active" data-page="grades">Grades</button><button data-page="values">Core Values</button><button data-page="attendance">Attendance</button><button data-page="print">Reports</button></aside><main class="main"><section id="grades" class="page active"><div class="card"><div class="section-title"><div><h2>Grade Entry</h2><p>Only students in your assigned subject and section are shown here. Enter grades directly in the table and save.</p></div></div><div id="teacherStatus" class="notice hidden"></div><div class="grid"><div class="field"><label>Subject</label><select id="subject"></select></div><div class="field"><label>Section</label><select id="section"></select></div><div class="field"><label>Grading System</label><input id="grading" readonly></div><div class="field"><label>Term</label><select id="term"></select></div></div><div class="tablewrap" style="margin-top:14px"><table class="table"><thead id="gradeHead"></thead><tbody id="gradeBody"></tbody></table></div><button class="btn" id="saveGrades">Save Grades</button></div></section><section id="values" class="page"><div class="card"><h2>DepEd Core Values</h2><div class="field"><label>Student</label><select id="valueStudent"></select></div><div id="valueForm"></div><button class="btn" id="saveValues">Save Core Values</button></div></section><section id="attendance" class="page"><div class="card"><h2>Attendance</h2><div class="field"><label>Student</label><select id="attStudent"></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Month</th><th>Present</th><th>Absent</th></tr></thead><tbody id="attBody"></tbody></table></div><button class="btn" id="saveAtt">Save Attendance</button></div></section><section id="print" class="page"><div class="card"><h2>Reports</h2><div class="field"><label>Student</label><select id="reportStudent"></select></div><div class="actions"><button class="btn" id="studentPDF">Print 1 Student Report Card as PDF</button><button class="btn secondary" id="gradesExcel">Download Grades as Excel</button><button class="btn secondary" id="gradePDF">Print Grade Sheet as PDF</button></div></div></section></main></div></div><script>
const firebaseConfig = {
  apiKey: "AIzaSyDIm2towADazJ9yuhUaIzVfX7ZaQEFbCpI",
  authDomain: "jpnhs-a2ba2.firebaseapp.com",
  databaseURL: "https://jpnhs-a2ba2-default-rtdb.firebaseio.com",
  projectId: "jpnhs-a2ba2",
  storageBucket: "jpnhs-a2ba2.firebasestorage.app",
  messagingSenderId: "689552509381",
  appId: "1:689552509381:web:98d043fc17189a636ea3ac"
};

firebase.initializeApp(firebaseConfig); const db=firebase.database(), auth=firebase.auth();
const qs=new URLSearchParams(location.search); const SCHOOL_ID=qs.get('school')||localStorage.getItem('schoolID')||'jpnhs';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const gradingTerms={'4Q':['Q1','Q2','Q3','Q4','Final'],'2SEM':['SEM1','SEM2','Final'],'3TRIM':['T1','T2','T3','Final']};
const depedValues=['Maka-Diyos','Makatao','Makakalikasan','Makabansa','Respect for Human Dignity','Respect for Others','Peace and Order','Justice','Honesty','Love of Country','Care for the Environment','Self-Discipline'];
async function school(){let s=(await db.ref('schools/'+SCHOOL_ID).once('value')).val();if(!s)throw Error('School configuration not found. Create it in Super Admin first.');if(s.expires&&s.expires<today()&&!location.pathname.endsWith('closed.html')){location.href='closed.html';return null}return s}
function setBrand(s){$$('[data-school-name]').forEach(x=>x.textContent=s?.name||'School Portal');$$('[data-school-logo]').forEach(x=>x.textContent=(s?.shortName||s?.name||'SP').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase());}
function termsSelect(el,g){el.innerHTML=(gradingTerms[g]||[]).map(x=>`<option value="${x}">${x}</option>`).join('')}
function gradeAverage(grades){let a=[];Object.values(grades||{}).forEach(g=>Object.values(g||{}).forEach(v=>{if(v!==''&&v!=null&&!isNaN(+v)&&+v<=100)a.push(+v)}));return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function calcFinal(vals){let nums=vals.filter(v=>v!==''&&!isNaN(+v)).map(Number);return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):''}
function downloadExcel(rows,name){let ws=XLSX.utils.json_to_sheet(rows);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,name)}
function pdfFrom(el,name,landscape=false){return html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{const {jsPDF}=window.jspdf;let pdf=new jsPDF(landscape?'l':'p','mm','a4');let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight();let ratio=Math.min((w-10)/c.width,(h-10)/c.height);pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*ratio,c.height*ratio);pdf.save(name)})}
function twoPagePDF(p1,p2,name){const {jsPDF}=window.jspdf;let pdf=new jsPDF('p','mm','a4');[p1,p2].forEach((el,i)=>{html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight(),r=Math.min((w-10)/c.width,(h-10)/c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*r,c.height*r);if(i===1)pdf.save(name)})})}
function nav(){ $$('.side button').forEach(b=>b.onclick=()=>{$$('.page').forEach(p=>p.classList.remove('active'));$('#'+b.dataset.page)?.classList.add('active');$$('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}) }
</script><script>
let S=null,ME=null,students={},assignments={};
const months=['June','July','August','September','October','November','December','January','February','March'];

async function init(){
  try{
    S=await school(); if(!S)return;
    setBrand(S);
    if(S.open===false||S.features?.teacher!==true)throw Error('Teacher Portal is closed or disabled.');
    $('#grading').value=S.gradingSystem;
    termsSelect($('#term'),S.gradingSystem);
    [students,assignments]=await Promise.all([
      db.ref('studentsBySchool/'+SCHOOL_ID).once('value').then(x=>x.val()||{}),
      db.ref('assignments/'+SCHOOL_ID).once('value').then(x=>x.val()||{})
    ]);
  }catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}
}

$('#tlogin').onclick=async()=>{
  try{
    await portalReady;
    const id=$('#tid').value.trim();
    const x=(await db.ref('staff/'+SCHOOL_ID+'/'+id).once('value')).val();
    if(!x||x.role!=='teacher'||x.active===false)throw Error('Teacher account not found or blocked.');
    ME={...x,staffID:id};
    await auth.signInWithEmailAndPassword(x.email,$('#tp').value);
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    await loadTeacher();
  }catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}
};

function teacherAssignments(){
  const ids=new Set([ME?.staffID,ME?.id,ME?.uid,ME?.email].filter(Boolean).map(String));
  return Object.values(assignments).filter(a=>a&&a.active!==false&&ids.has(String(a.teacherID)));
}

async function loadTeacher(){
  [students,assignments]=await Promise.all([
    db.ref('studentsBySchool/'+SCHOOL_ID).once('value').then(x=>x.val()||{}),
    db.ref('assignments/'+SCHOOL_ID).once('value').then(x=>x.val()||{})
  ]);
  const mine=teacherAssignments();
  if(!mine.length){
    fill($('#subject'),[]);fill($('#section'),[]);$('#gradeBody').innerHTML='';
    $('#teacherStatus').textContent='No class assignments were found for this Teacher ID. Ask the Registrar to assign your subject and section.';
    $('#teacherStatus').classList.remove('hidden');
    return;
  }
  $('#teacherStatus').classList.add('hidden');

  // Keep subject/section choices tied to actual assignments.
  const subjects=[...new Set(mine.map(a=>a.subject).filter(Boolean))];
  fill($('#subject'),subjects);
  const chosenSubject=subjects[0]||'';
  $('#subject').value=chosenSubject;
  updateSectionsForSubject();
}

function updateSectionsForSubject(){
  const mine=teacherAssignments().filter(a=>!$('#subject').value||a.subject===$('#subject').value);
  const sections=[...new Set(mine.map(a=>a.section).filter(Boolean))];
  const previous=$('#section').value;
  fill($('#section'),sections);
  if(sections.includes(previous))$('#section').value=previous;
  else if(sections.length)$('#section').value=sections[0];
  syncStudents();
}

function syncStudents(){
  const subject=$('#subject').value;
  const sec=$('#section').value;
  const mine=teacherAssignments().filter(a=>(!subject||a.subject===subject)&&(!sec||a.section===sec));
  const assignedLevels=new Set(mine.map(a=>a.level).filter(Boolean));

  const rows=Object.entries(students).filter(([id,s])=>
    s.schoolYear===S.schoolYear &&
    s.section===sec &&
    (!assignedLevels.size||assignedLevels.has(s.level))
  );

  const heads=gradingTerms[S.gradingSystem]||[];
  $('#gradeHead').innerHTML='<tr><th>Student</th>'+heads.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';
  $('#gradeBody').innerHTML=rows.map(([id,s])=>{
    const g=s.grades?.[subject]||{};
    const cells=heads.map(x=>`<td><input class="grade grade-input" type="number" min="0" max="100" step="1" inputmode="numeric" data-id="${esc(id)}" data-term="${esc(x)}" value="${esc(g[x]??'')}" aria-label="${esc(s.name+' '+x)}"></td>`).join('');
    return `<tr><td><strong>${esc(s.name)}</strong><br><small class="muted">${esc(id)}</small></td>${cells}</tr>`;
  }).join('')||'<tr><td colspan="'+(heads.length+1)+'" class="empty">No students found for this assigned class. Check the Registrar assignment and the students’ section/school year.</td></tr>';

  const ids=rows.map(x=>x[0]);
  fill($('#valueStudent'),ids.map(id=>id+' — '+students[id].name));
  fill($('#attStudent'),ids.map(id=>id+' — '+students[id].name));
  fill($('#reportStudent'),ids.map(id=>id+' — '+students[id].name));
  renderValue();renderAtt();
}

$('#section').onchange=syncStudents;
$('#subject').onchange=updateSectionsForSubject;

function fill(el,a){
  el.innerHTML=(a||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
}

$('#saveGrades').onclick=async()=>{
  try{
    const subject=$('#subject').value;
    if(!subject)throw Error('Select a subject first.');
    const grouped={};
    $$('.grade').forEach(i=>{
      const raw=i.value.trim();
      if(raw!=='' && (!Number.isFinite(Number(raw))||Number(raw)<0||Number(raw)>100))
        throw Error('Grades must be numbers from 0 to 100.');
      const id=i.dataset.id;
      grouped[id]=grouped[id]||{};
      grouped[id][i.dataset.term]=raw;
    });
    const allowedIds=new Set(Object.entries(students)
      .filter(([id,s])=>s.schoolYear===S.schoolYear&&s.section===$('#section').value)
      .map(x=>x[0]));
    for(const id in grouped){
      if(!allowedIds.has(id))continue;
      const old={...(students[id].grades||{})};
      old[subject]={...(old[subject]||{}),...grouped[id]};
      await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/grades').set(old);
      students[id].grades=old;
    }
    alert('Grades saved successfully.');
  }catch(e){alert(e.message)}
};

function renderValue(){
  const id=($('#valueStudent').value||'').split(' — ')[0],v=students[id]?.coreValues||{};
  $('#valueForm').innerHTML=depedValues.map(x=>`<div class="switch"><span>${esc(x)}</span><select data-value="${esc(x)}"><option>NOT OBSERVED</option><option>RARELY</option><option>SOMETIMES</option><option>OFTEN</option><option>ALWAYS</option></select></div>`).join('');
  $$('[data-value]').forEach(s=>s.value=v[s.dataset.value]||'NOT OBSERVED');
}
$('#valueStudent').onchange=renderValue;
$('#saveValues').onclick=async()=>{
  const id=$('#valueStudent').value.split(' — ')[0];if(!id)return alert('Select a student.');
  const v={};$$('[data-value]').forEach(s=>v[s.dataset.value]=s.value);
  await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/coreValues').set(v);
  students[id].coreValues=v;alert('Core Values saved.');
};

function renderAtt(){
  const id=($('#attStudent').value||'').split(' — ')[0],a=students[id]?.attendance||{};
  $('#attBody').innerHTML=months.map(m=>`<tr><td>${m}</td><td><input data-month="${m}" data-a="p" value="${a[m]?.present||0}" type="number" min="0"></td><td><input data-month="${m}" data-a="a" value="${a[m]?.absent||0}" type="number" min="0"></td></tr>`).join('');
}
$('#attStudent').onchange=renderAtt;
$('#saveAtt').onclick=async()=>{
  const id=$('#attStudent').value.split(' — ')[0];if(!id)return alert('Select a student.');
  const a={};$$('[data-month]').forEach(i=>{a[i.dataset.month]=a[i.dataset.month]||{};a[i.dataset.month][i.dataset.a]=+i.value||0});
  a.totalPresent=months.reduce((n,m)=>n+(a[m]?.present||0),0);
  a.totalAbsent=months.reduce((n,m)=>n+(a[m]?.absent||0),0);
  await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/attendance').set(a);
  students[id].attendance=a;alert('Attendance saved.');
};

function reportHtml(s){
  let heads=gradingTerms[S.gradingSystem]||[],subjects=Object.keys(s.grades||{}),avg=gradeAverage(s.grades);
  return `<div class="report"><header><div><h2>${esc(S.name)}</h2><div>Student Report Card — ${esc(s.schoolYear)}</div></div></header>
  <p><b>Student ID:</b> ${esc(s.studentID)} &nbsp; <b>Name:</b> ${esc(s.name)} &nbsp; <b>Level:</b> ${esc(s.level)} &nbsp; <b>Section:</b> ${esc(s.section)}</p>
  <table><tr><th>Subject</th>${heads.map(x=>'<th>'+x+'</th>').join('')}</tr>${subjects.map(sub=>`<tr><td>${esc(sub)}</td>${heads.map(h=>`<td>${esc(s.grades[sub]?.[h]??'')}</td>`).join('')}</tr>`).join('')}</table>
  <p><b>General Average:</b> ${avg?avg.toFixed(2):'—'} &nbsp; <b>Remarks:</b> ${avg>=75?'PASSED':'—'}</p><div class="sig"><div>Class Adviser</div><div>School Principal</div><div>Parent/Guardian</div></div></div>`;
}

$('#studentPDF').onclick=async()=>{
  if(!S.features?.pdfReportCard)return alert('PDF Report Card is disabled.');
  const id=$('#reportStudent').value.split(' — ')[0],s=students[id];if(!s)return alert('Select a student.');
  const el=document.createElement('div');el.innerHTML=reportHtml(s);document.body.appendChild(el.firstElementChild);
  const report=el.firstElementChild;await pdfFrom(report,'student-report-card.pdf');report.remove();
};
$('#gradesExcel').onclick=()=>{
  const a=Object.entries(students).filter(([id,s])=>s.section===$('#section').value);
  downloadExcel(a.map(([id,s])=>({studentID:id,name:s.name,level:s.level,section:s.section,subject:$('#subject').value,...(s.grades?.[$('#subject').value]||{})})),'grades.xlsx');
};
$('#gradePDF').onclick=()=>{
  const el=document.createElement('div');el.className='report';
  el.innerHTML='<h2>'+esc(S.name)+' — Grade Sheet</h2>'+$('#gradeBody').parentElement.outerHTML;
  document.body.appendChild(el);pdfFrom(el,'grade-sheet.pdf').then(()=>el.remove());
};
$('#logout').onclick=()=>auth.signOut().then(()=>location.reload());
nav();const portalReady=init();
</script></body></html>
