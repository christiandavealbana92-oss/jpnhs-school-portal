<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher</title><style>
:root{--blue:#0757a5;--blue2:#0b74d1;--ink:#132238;--muted:#65758b;--line:#dce5ef;--bg:#f4f7fb;--white:#fff;--danger:#c62828;--ok:#16834b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{max-width:1400px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:230px}.logo{width:42px;height:42px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 67px)}.side{background:#fff;border-right:1px solid var(--line);padding:16px}.side button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#405169;margin-bottom:4px}.side button.active,.side button:hover{background:#eaf3fd;color:var(--blue);font-weight:700}.main{padding:22px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #1a365d08}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#52637a}.field input,.field select,.field textarea{border:1px solid #ccd8e6;border-radius:8px;padding:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0b74d118}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#eef4fa;color:#1e4f7f}.btn.danger{background:#c62828}.btn.success{background:#16834b}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat strong{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted)}.notice{padding:12px;border-radius:8px;background:#eef7ff;border:1px solid #cfe4f8;margin-bottom:14px}.notice.warn{background:#fff7e6;border-color:#f2d28c}.notice.error{background:#fff0f0;border-color:#f0bcbc;color:#8d2020}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f6f9fc;color:#42566e}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#edf4fb;color:#35658d}.pill.ok{background:#e9f7ef;color:#16834b}.pill.bad{background:#fff0f0;color:#c62828}.switch{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}.switch input{width:18px;height:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf5ff,#fff)}.loginbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 15px 50px #15365d18}.loginbox .logo{margin-bottom:12px}.loginbox h1{margin:6px 0}.hidden{display:none!important}.report{background:#fff;color:#111;padding:28px;width:100%;max-width:900px;margin:auto}.report header{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px}.report .rlogo{width:50px;height:50px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.report h2{margin:4px 0;font-size:18px}.report table{width:100%;border-collapse:collapse;margin:12px 0}.report th,.report td{border:1px solid #777;padding:6px;font-size:11px}.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px;text-align:center}.sig div{border-top:1px solid #333;padding-top:5px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:18px}.search{max-width:380px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:5px}.side button{min-width:max-content}.grid,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topin{flex-wrap:wrap}.brand{min-width:0}.top-actions{width:100%;margin-left:0}.grid,.grid2,.stats{grid-template-columns:1fr}.main{padding:12px}.sig{grid-template-columns:1fr}.report{padding:15px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head><body><div class="login" id="login"><div class="loginbox"><div class="logo" data-school-logo>SP</div><h1 data-school-name>School Portal</h1><p class="muted">Teacher Portal</p><div class="field"><label>Teacher ID</label><input id="tid" placeholder="T-0001"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="tp" type="password"></div><button class="btn" style="margin-top:14px;width:100%" id="tlogin">Sign in</button><p id="lm" class="notice hidden"></p></div></div><div id="app" class="hidden"><div class="top"><div class="topin"><div class="brand"><div class="logo" data-school-logo>SP</div><div><b>Teacher Portal</b><small data-school-name></small></div></div><button class="btn secondary" id="logout">Logout</button></div></div><div class="layout"><aside class="side"><button class="active" data-page="grades">Grades</button><button data-page="values">Core Values</button><button data-page="attendance">Attendance</button><button data-page="print">Reports</button></aside><main class="main"><section id="grades" class="page active"><div class="card"><h2>Grade Entry</h2><div class="grid"><div class="field"><label>Subject</label><select id="subject"></select></div><div class="field"><label>Section</label><select id="section"></select></div><div class="field"><label>Grading System</label><input id="grading" readonly></div><div class="field"><label>Term</label><select id="term"></select></div></div><div class="tablewrap" style="margin-top:14px"><table class="table"><thead id="gradeHead"></thead><tbody id="gradeBody"></tbody></table></div><button class="btn" id="saveGrades">Save Grades</button></div></section><section id="values" class="page"><div class="card"><h2>DepEd Core Values</h2><div class="field"><label>Student</label><select id="valueStudent"></select></div><div id="valueForm"></div><button class="btn" id="saveValues">Save Core Values</button></div></section><section id="attendance" class="page"><div class="card"><h2>Attendance</h2><div class="field"><label>Student</label><select id="attStudent"></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Month</th><th>Present</th><th>Absent</th></tr></thead><tbody id="attBody"></tbody></table></div><button class="btn" id="saveAtt">Save Attendance</button></div></section><section id="print" class="page"><div class="card"><h2>Reports</h2><div class="field"><label>Student</label><select id="reportStudent"></select></div><div class="actions"><button class="btn" id="studentPDF">Print 1 Student Report Card as PDF</button><button class="btn secondary" id="gradesExcel">Download Grades as Excel</button><button class="btn secondary" id="gradePDF">Print Grade Sheet as PDF</button></div></div></section></main></div></div><script>
const firebaseConfig = {
  apiKey: "AIzaSyDIm2towADazJ9yuhUaIzVfX7ZaQEFbCpI",
  authDomain: "jpnhs-a2ba2.firebaseapp.com",
  databaseURL: "https://jpnhs-a2ba2-default-rtdb.firebaseio.com",
  projectId: "jpnhs-a2ba2",
  storageBucket: "jpnhs-a2ba2.firebasestorage.app",
  messagingSenderId: "689552509381",
  appId: "1:689552509381:web:98d043fc17189a636ea3ac"
};

firebase.initializeApp(firebaseConfig); const db=firebase.database(), auth=firebase.auth();
const qs=new URLSearchParams(location.search); const SCHOOL_ID=qs.get('school')||localStorage.getItem('schoolID')||'jpnhs';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const gradingTerms={'4Q':['Q1','Q2','Q3','Q4','Final'],'2SEM':['SEM1','SEM2','Final'],'3TRIM':['T1','T2','T3','Final']};
const depedValues=['Maka-Diyos','Makatao','Makakalikasan','Makabansa','Respect for Human Dignity','Respect for Others','Peace and Order','Justice','Honesty','Love of Country','Care for the Environment','Self-Discipline'];
async function school(){let s=(await db.ref('schools/'+SCHOOL_ID).once('value')).val();if(!s)throw Error('School configuration not found. Create it in Administrator first.');if(s.expires&&s.expires<today()&&!location.pathname.endsWith('closed.html')){location.href='closed.html';return null}return s}
function setBrand(s){$$('[data-school-name]').forEach(x=>x.textContent=s?.name||'School Portal');$$('[data-school-logo]').forEach(x=>x.textContent=(s?.shortName||s?.name||'SP').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase());}
function termsSelect(el,g){el.innerHTML=(gradingTerms[g]||[]).map(x=>`<option value="${x}">${x}</option>`).join('')}
function gradeAverage(grades){let a=[];Object.values(grades||{}).forEach(g=>Object.values(g||{}).forEach(v=>{if(v!==''&&v!=null&&!isNaN(+v)&&+v<=100)a.push(+v)}));return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function calcFinal(vals){let nums=vals.filter(v=>v!==''&&!isNaN(+v)).map(Number);return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):''}
function downloadExcel(rows,name){let ws=XLSX.utils.json_to_sheet(rows);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,name)}
function pdfFrom(el,name,landscape=false){return html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{const {jsPDF}=window.jspdf;let pdf=new jsPDF(landscape?'l':'p','mm','a4');let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight();let ratio=Math.min((w-10)/c.width,(h-10)/c.height);pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*ratio,c.height*ratio);pdf.save(name)})}
function twoPagePDF(p1,p2,name){const {jsPDF}=window.jspdf;let pdf=new jsPDF('p','mm','a4');[p1,p2].forEach((el,i)=>{html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight(),r=Math.min((w-10)/c.width,(h-10)/c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*r,c.height*r);if(i===1)pdf.save(name)})})}
function nav(){ $$('.side button').forEach(b=>b.onclick=()=>{$$('.page').forEach(p=>p.classList.remove('active'));$('#'+b.dataset.page)?.classList.add('active');$$('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}) }
</script><script>let S,ME,students={},assignments={};const months=['June','July','August','September','October','November','December','January','February','March'];async function init(){try{S=await school();if(!S)return;setBrand(S);if(S.open===false||S.features?.teacher!==true)throw Error('Teacher Portal is closed or disabled.');$('#grading').value=S.gradingSystem;termsSelect($('#term'),S.gradingSystem);let st=(await db.ref('studentsBySchool/'+SCHOOL_ID).once('value')).val()||{};students=st;assignments=(await db.ref('assignments/'+SCHOOL_ID).once('value')).val()||{};}catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}}
$('#tlogin').onclick=async()=>{try{let id=$('#tid').value.trim(),x=(await db.ref('staff/'+SCHOOL_ID+'/'+id).once('value')).val();if(!x||x.role!=='teacher'||x.active===false)throw Error('Teacher account not found or blocked.');ME=x;await auth.signInWithEmailAndPassword(x.email,$('#tp').value);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadTeacher()}catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}};
function loadTeacher(){let my=Object.values(assignments).filter(a=>a.teacherID===Object.keys(assignments).find(k=>assignments[k].teacherID===ME?.staffID));let ids=Object.entries(assignments).filter(([i,a])=>a.teacherID===ME.id||a.teacherID===ME.staffID).map(([i,a])=>a);if(!ids.length)ids=Object.values(assignments).filter(a=>a.teacherID===($('#tid').value));fill($('#subject'),[...new Set(ids.map(a=>a.subject))]);fill($('#section'),[...new Set(ids.map(a=>a.section))]);syncStudents();}
function syncStudents(){let sec=$('#section').value;let a=Object.entries(students).filter(([id,s])=>s.section===sec&&s.schoolYear===S.schoolYear);$('#gradeBody').innerHTML='';let heads=gradingTerms[S.gradingSystem];$('#gradeHead').innerHTML='<tr><th>Student</th>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr>';a.forEach(([id,s])=>{let g=s.grades?.[$('#subject').value]||{};let cells=heads.map((x,i)=>`<td><input class="grade" data-id="${esc(id)}" data-term="${x}" value="${g[x]??''}" style="width:70px"></td>`).join('');$('#gradeBody').insertAdjacentHTML('beforeend',`<tr><td>${esc(s.name)}<br><small>${esc(id)}</small></td>${cells}</tr>`)});let ids=a.map(x=>x[0]);fill($('#valueStudent'),ids.map(id=>id+' — '+students[id].name));fill($('#attStudent'),ids.map(id=>id+' — '+students[id].name));fill($('#reportStudent'),ids.map(id=>id+' — '+students[id].name));renderValue();renderAtt()}
$('#section').onchange=syncStudents;$('#subject').onchange=syncStudents;function fill(el,a){el.innerHTML=(a||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
$('#saveGrades').onclick=async()=>{let grouped={};$$('.grade').forEach(i=>{let id=i.dataset.id;grouped[id]=grouped[id]||{};grouped[id][i.dataset.term]=i.value});for(let id in grouped){let old=students[id].grades||{},sub=$('#subject').value;old[sub]={...(old[sub]||{}),...grouped[id]};await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/grades').set(old)}alert('Grades saved.');students=(await db.ref('studentsBySchool/'+SCHOOL_ID).once('value')).val()||{}};
function renderValue(){let id=($('#valueStudent').value||'').split(' — ')[0],v=students[id]?.coreValues||{};$('#valueForm').innerHTML=depedValues.map(x=>`<div class="switch"><span>${esc(x)}</span><select data-value="${esc(x)}"><option>NOT OBSERVED</option><option>RARELY</option><option>SOMETIMES</option><option>OFTEN</option><option>ALWAYS</option></select></div>`).join('');$$('[data-value]').forEach(s=>s.value=v[s.dataset.value]||'NOT OBSERVED')}$('#valueStudent').onchange=renderValue;$('#saveValues').onclick=async()=>{let id=$('#valueStudent').value.split(' — ')[0],v={};$$('[data-value]').forEach(s=>v[s.dataset.value]=s.value);await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/coreValues').set(v);alert('Core Values saved.')};
function renderAtt(){let id=($('#attStudent').value||'').split(' — ')[0],a=students[id]?.attendance||{};$('#attBody').innerHTML=months.map(m=>`<tr><td>${m}</td><td><input data-month="${m}" data-a="p" value="${a[m]?.present||0}" type="number" min="0"></td><td><input data-month="${m}" data-a="a" value="${a[m]?.absent||0}" type="number" min="0"></td></tr>`).join('')}$('#attStudent').onchange=renderAtt;$('#saveAtt').onclick=async()=>{let id=$('#attStudent').value.split(' — ')[0],a={};$$('[data-month]').forEach(i=>{a[i.dataset.month]=a[i.dataset.month]||{};a[i.dataset.month][i.dataset.a]=+i.value||0});a.totalPresent=months.reduce((n,m)=>n+(a[m]?.present||0),0);a.totalAbsent=months.reduce((n,m)=>n+(a[m]?.absent||0),0);await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/attendance').set(a);alert('Attendance saved.')};
function reportHtml(s){let heads=gradingTerms[S.gradingSystem];let subjects=Object.keys(s.grades||{});let avg=gradeAverage(s.grades);return `<div class="report"><header><div class="rlogo">${esc(S.shortName||'SP')}</div><div><h2>${esc(S.name)}</h2><div>Student Report Card — ${esc(S.schoolYear)}</div></div></header><p><b>Student ID:</b> ${esc(s.studentID)} &nbsp; <b>Name:</b> ${esc(s.name)} &nbsp; <b>Level:</b> ${esc(s.level)} &nbsp; <b>Section:</b> ${esc(s.section)}</p><table><tr><th>Subject</th>${heads.map(x=>'<th>'+x+'</th>').join('')}</tr>${subjects.map(sub=>`<tr><td>${esc(sub)}</td>${heads.map(h=>`<td>${esc(s.grades[sub]?.[h]??'')}</td>`).join('')}</tr>`).join('')}</table><p><b>General Average:</b> ${avg?avg.toFixed(2):'—'} &nbsp; <b>Remarks:</b> ${avg>=75?'PASSED':'—'}</p><div class="sig"><div>Class Adviser</div><div>School Principal</div><div>Parent/Guardian</div></div></div>`}
$('#studentPDF').onclick=async()=>{if(!S.features?.pdfReportCard)return alert('PDF Report Card is disabled.');let id=$('#reportStudent').value.split(' — ')[0],s=students[id];let p1=document.createElement('div');p1.innerHTML=reportHtml(s);document.body.appendChild(p1.firstElementChild);let el=p1.firstElementChild;pdfFrom(el,'student-report-card.pdf').then(()=>el.remove())};$('#gradesExcel').onclick=()=>{let a=Object.entries(students).filter(([id,s])=>s.section===$('#section').value).map(([id,s])=>({studentID:id,name:s.name,level:s.level,section:s.section,subject:$('#subject').value,...(s.grades?.[$('#subject').value]||{})}));downloadExcel(a,'grades.xlsx')};$('#gradePDF').onclick=()=>{let el=document.createElement('div');el.className='report';el.innerHTML='<h2>'+esc(S.name)+' — Grade Sheet</h2>'+$('#gradeBody').parentElement.outerHTML;document.body.appendChild(el);pdfFrom(el,'grade-sheet.pdf').then(()=>el.remove())};$('#logout').onclick=()=>auth.signOut().then(()=>location.reload());nav();init();</script></body></html>
