nter;font-weight:800}.report h2{margin:4px 0;font-size:18px}.report table{width:100%;border-collapse:collapse;margin:12px 0}.report th,.report td{border:1px solid #777;padding:6px;font-size:11px}.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px;text-align:center}.sig div{border-top:1px solid #333;padding-top:5px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:18px}.search{max-width:380px}.empty{text-align:center;padding:35px;color:var(--muted)}

="valueForm"></div><button class="btn" id="saveValues">Save Core Values</button></div></section><section id="attendance" class="page"><div class="card"><h2>Daily Attendance</h2><div class="grid"><div class="field"><label>Date</label><input id="attDate" type="date"></div><div class="field"><label>Section</label><select id="attSection"></select></div></div><p class="muted">Mark every student for this class each day. Present = green, Late = blue, Absent = red.</p><div class="tablewrap"><table class="table"><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody id="attBody"></tbody></table></div><button class="btn" id="saveAtt">Save Daily Attendance</button></div></section><section id="print" class="page"><div class="card"><h2>Reports</h2><div class="field"><label>Student</label><select id="reportStudent"></select></div><div class="actions"><button class="btn" id="studentPDF">Print 1 Student Report Card as PDF</button><button class="btn secondary" id="gradesExcel">Download Grades as Excel</button><button class="btn secondary" id="gradePDF">Print Grade Sheet as PDF</button></div></div></section></main></div></div><script>

async function school(){let s=(await db.ref('schools/'+SCHOOL_ID).once('value')).val();if(!s)throw Error('School configuration not found. Create it in Administrator first.');if(s.expires&&s.expires<today()&&!location.pathname.endsWith('closed.html')){location.href='closed.html';return null}return s}
function brandingInitials(name){return String(name||'School Portal').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'SP'}
function brandingPartners(s){const p=s?.partners;if(Array.isArray(p))return p;if(p&&typeof p==='object')return Object.values(p);return []}

function reportBrandHeader(s,title){const ps=brandingPartners(s);return `<header class="report-brand"><div class="rlogo">${brandLogoHTML(s,'report-logo')}</div><div><h2>${esc(s?.name||'School Portal')}</h2><div>${esc(title)}</div></div></header>${ps.length?`<div class="report-partners">${ps.map(p=>`<span>${p.logo?`<img src="${esc(p.logo)}" alt="">`:esc(brandingInitials(p.name))}<b>${esc(p.name||'Partner')}</b></span>`).join('')}</div>`:''}`}
function setBrand(s){$$('[data-school-name]').forEach(x=>x.textContent=s?.name||'School Portal');$$('[data-school-logo]').forEach(x=>x.innerHTML=brandLogoHTML(s));let host=document.querySelector('.topin');if(host&&!host.querySelector('.portal-partners')){const d=document.createElement('div');d.innerHTML=partnerStripHTML(s);const el=d.firstElementChild;if(el)host.appendChild(el)}}
function termsSelect(el,g){el.innerHTML=(gradingTerms[g]||[]).map(x=>`<option value="${x}">${x}</option>`).join('')}
function gradeAverage(grades){let a=[];Object.values(grades||{}).forEach(g=>Object.values(g||{}).forEach(v=>{if(v!==''&&v!=null&&!isNaN(+v)&&+v<=100)a.push(+v)}));return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function calcFinal(vals){let nums=vals.filter(v=>v!==''&&!isNaN(+v)).map(Number);return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):''}
async function downloadExcel(rows,name,school=S,sheetName='Data'){const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet(sheetName);const logo=school?.logo;const partners=brandingPartners(school);let row=1;if(logo){const base64=logo.split(',')[1]||logo;const ext=logo.includes('png')?'png':'jpeg';const imgId=wb.addImage({base64:base64,extension:ext});ws.addImage(imgId,{tl:{col:0,row:0},ext:{width:70,height:70}});row=5}ws.getCell(row,1).value=school?.name||'School Portal';ws.getCell(row,1).font={bold:true,size:16};row++;if(partners.length){ws.getCell(row,1).value='Partners';ws.getCell(row,1).font={bold:true};row++;for(const p of partners){ws.getCell(row,1).value=p.name||'Partner';if(p.logo){const b=p.logo.split(',')[1]||p.logo;const ext=p.logo.includes('png')?'png':'jpeg';const id=wb.addImage({base64:b,extension:ext});ws.addImage(id,{tl:{col:1,row:row-1},ext:{width:45,height:45}})}row+=3}}row++;const keys=rows.length?Object.keys(rows[0]):['Status'];keys.forEach((k,i)=>{ws.getCell(row,i+1).value=k;ws.getCell(row,i+1).font={bold:true}});row++;rows.forEach(r=>keys.forEach((k,i)=>ws.getCell(row,i+1).value=r[k]??''));keys.forEach((k,i)=>ws.getColumn(i+1).width=Math.min(35,Math.max(12,k.length+3)));const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function pdfFrom(el,name,landscape=false){return html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{const {jsPDF}=window.jspdf;let pdf=new jsPDF(landscape?'l':'p','mm','a4');let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight();let ratio=Math.min((w-10)/c.width,(h-10)/c.height);pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*ratio,c.height*ratio);pdf.save(name)})}
function twoPagePDF(p1,p2,name){const {jsPDF}=window.jspdf;let pdf=new jsPDF('p','mm','a4');[p1,p2].forEach((el,i)=>{html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight(),r=Math.min((w-10)/c.width,(h-10)/c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*r,c.height*r);if(i===1)pdf.save(name)})})}

</script><script>let S,ME,students={},assignments={};const months=['June','July','August','September','October','November','December','January','February','March'];function configuredGradingTerms(s){const map={"4Q":["Q1","Q2","Q3","Q4","Final"],"2SEM":["SEM1","SEM2","Final"],"3TRIM":["T1","T2","T3","Final"]};let v=s?.gradingTerms||s?.grading_terms||s?.gradingSystem||s?.grading_system;let keys=Array.isArray(v)?v:(v&&typeof v==='object'?Object.keys(v).filter(k=>v[k]):[v]);let out=[];keys.forEach(k=>{if(map[k])out.push(...map[k]);else if(Object.values(map).flat().includes(String(k)))out.push(String(k));});return [...new Set(out)]}
async function init(){try{S=await school();if(!S)return;setBrand(S);if(S.open===false||S.features?.teacher!==true)throw Error('Teacher Portal is closed or disabled.');let st=(await db.ref('studentsBySchool/'+SCHOOL_ID).once('value')).val()||{};students=st;assignments=(await db.ref('assignments/'+SCHOOL_ID).once('value')).val()||{};}catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}}
$('#tlogin').onclick=async()=>{try{let id=$('#tid').value.trim(),x=(await db.ref('staff/'+SCHOOL_ID+'/'+id).once('value')).val();if(!x||String(x.role||'').toLowerCase()!=='teacher'||x.active===false)throw Error('Teacher account not found or blocked.');if(x.password!==$('#tp').value)throw Error('Incorrect password.');ME={...x,staffID:id,id:id};localStorage.setItem('schoolPortalUser',JSON.stringify({key:'staff:'+id,name:x.name||id,role:'Teacher'}));$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadTeacher() }catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}};
function loadTeacher(){let teacherId=ME.staffID||ME.id;let ids=Object.entries(assignments).filter(([,a])=>String(a.teacherID||'')===String(teacherId)&&a.active!==false).map(([id,a])=>({id,...a}));window.teacherAssignments=ids;fill($('#subject'),[...new Set(ids.map(a=>a.subject).filter(Boolean))]);syncSectionsForSubject();const now=new Date();$('#attDate').value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);fill($('#attSection'),[...new Set(ids.map(a=>a.section).filter(Boolean))]);syncStudents()}
function allowedAssignment(){return (window.teacherAssignments||[]).find(a=>a.subject===$('#subject').value&&a.section===$('#section').value&&a.active!==false)}
function syncSectionsForSubject(){let sub=$('#subject').value;let secs=[...new Set((window.teacherAssignments||[]).filter(a=>a.subject===sub).map(a=>a.section).filter(Boolean))];fill($('#section'),secs);fill($('#attSection'),secs);syncStudents()}
function classStudents(section){let asg=allowedAssignment();return Object.entries(students).filter(([id,s])=>{if(s.schoolID&&String(s.schoolID)!==String(SCHOOL_ID))return false;if(s.schoolYear!==S.schoolYear)return false;return s.section===section&&(!asg?.level||s.level===asg.level)})}
function syncStudents(){let asg=allowedAssignment(),sec=$('#section').value,a=classStudents(sec),heads=configuredGradingTerms(S);$('#grading').value=asg?.gradingSystem||S.gradingSystem||'';$('#term').innerHTML=heads.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')||'<option value="">No grading terms configured</option>';$('#gradeBody').innerHTML='';$('#gradeHead').innerHTML='<tr><th>Student</th>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr>';a.forEach(([id,s])=>{let g=s.grades?.[asg?.subject||$('#subject').value]||{};let cells=heads.map(x=>`<td><input class="grade" data-id="${esc(id)}" data-term="${esc(x)}" value="${g[x]??''}" style="width:70px" min="0" max="100" type="number"></td>`).join('');$('#gradeBody').insertAdjacentHTML('beforeend',`<tr><td>${esc(s.name)}<br><small>${esc(id)}</small></td>${cells}</tr>`)});let ids=a.map(x=>x[0]);fill($('#valueStudent'),ids.map(id=>id+' — '+students[id].name));fill($('#reportStudent'),ids.map(id=>id+' — '+students[id].name));renderValue();renderAtt()}
$('#section').onchange=syncStudents;$('#subject').onchange=syncSectionsForSubject;$('#attSection').onchange=renderAtt;function fill(el,a){el.innerHTML=(a||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
$('#saveGrades').onclick=async()=>{let asg=allowedAssignment();if(!asg)return alert('This subject/section is not assigned to your teacher account.');let grouped={};$$('.grade').forEach(i=>{let id=i.dataset.id;grouped[id]=grouped[id]||{};grouped[id][i.dataset.term]=i.value});for(let id in grouped){let old=students[id].grades||{},sub=asg.subject;old[sub]={...(old[sub]||{}),...grouped[id]};await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/grades').set(old)}alert('Grades saved.');students=(await db.ref('studentsBySchool/'+SCHOOL_ID).once('value')).val()||{};syncStudents()}
function renderValue(){let id=($('#valueStudent').value||'').split(' — ')[0],v=students[id]?.coreValues||{};$('#valueForm').innerHTML=depedValues.map(x=>`<div class="switch"><span>${esc(x)}</span><select data-value="${esc(x)}"><option>NOT OBSERVED</option><option>RARELY</option><option>SOMETIMES</option><option>OFTEN</option><option>ALWAYS</option></select></div>`).join('');$$('[data-value]').forEach(s=>s.value=v[s.dataset.value]||'NOT OBSERVED')}$('#valueStudent').onchange=renderValue;$('#saveValues').onclick=async()=>{let id=$('#valueStudent').value.split(' — ')[0],v={};$$('[data-value]').forEach(s=>v[s.dataset.value]=s.value);await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/coreValues').set(v);alert('Core Values saved.')};
async function renderAtt(){let sec=$('#attSection').value,date=$('#attDate').value,a=classStudents(sec);$('#attBody').innerHTML='';for(const [id,s] of a){let status=s.attendance?.daily?.[date]?.status||'present';$('#attBody').insertAdjacentHTML('beforeend',`<tr><td>${esc(s.name)}<br><small>${esc(id)}</small></td><td><select class="att-status" data-id="${esc(id)}"><option value="present" ${status==='present'?'selected':''}>Present</option><option value="late" ${status==='late'?'selected':''}>Late</option><option value="absent" ${status==='absent'?'selected':''}>Absent</option></select></td></tr>`)}}
$('#attDate').onchange=renderAtt;$('#saveAtt').onclick=async()=>{let sec=$('#attSection').value,date=$('#attDate').value;if(!date)return alert('Select an attendance date.');let rows=$$('.att-status');if(!rows.length)return alert('No students found for this assigned section.');for(const el of rows){let id=el.dataset.id;await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id+'/attendance/daily/'+date).set({status:el.value,markedBy:ME.staffID||ME.id,markedAt:new Date().toISOString()})}alert('Daily attendance saved.');students=(await db.ref('studentsBySchool/'+SCHOOL_ID).once('value')).val()||{};await renderAtt()};
function reportHtml(s){let heads=configuredGradingTerms(S);let subjects=Object.keys(s.grades||{});let avg=gradeAverage(s.grades);return `<div class="report">${reportBrandHeader(S,'Student Report Card — '+S.schoolYear)}<p><b>Student ID:</b> ${esc(s.studentID)} &nbsp; <b>Name:</b> ${esc(s.name)} &nbsp; <b>Level:</b> ${esc(s.level)} &nbsp; <b>Section:</b> ${esc(s.section)}</p><table><tr><th>Subject</th>${heads.map(x=>'<th>'+x+'</th>').join('')}</tr>${subjects.map(sub=>`<tr><td>${esc(sub)}</td>${heads.map(h=>`<td>${esc(s.grades[sub]?.[h]??'')}</td>`).join('')}</tr>`).join('')}</table><p><b>General Average:</b> ${avg?avg.toFixed(2):'—'} &nbsp; <b>Remarks:</b> ${avg>=75?'PASSED':'—'}</p><div class="sig"><div>Class Adviser</div><div>School Principal</div><div>Parent/Guardian</div></div></div>`}
$('#studentPDF').onclick=async()=>{if(!S.features?.pdfReportCard)return alert('PDF Report Card is disabled.');let id=$('#reportStudent').value.split(' — ')[0],s=students[id];let p1=document.createElement('div');p1.innerHTML=reportHtml(s);document.body.appendChild(p1.firstElementChild);let el=p1.firstElementChild;pdfFrom(el,'student-report-card.pdf').then(()=>el.remove())};$('#gradesExcel').onclick=()=>{let a=Object.entries(students).filter(([id,s])=>s.section===$('#section').value).map(([id,s])=>({studentID:id,name:s.name,level:s.level,section:s.section,subject:$('#subject').value,...(s.grades?.[$('#subject').value]||{})}));downloadExcel(a,'grades.xlsx')};$('#gradePDF').onclick=()=>{let el=document.createElement('div');el.className='report';el.innerHTML='<h2>'+esc(S.name)+' — Grade Sheet</h2>'+$('#gradeBody').parentElement.outerHTML;document.body.appendChild(el);pdfFrom(el,'grade-sheet.pdf').then(()=>el.remove())};$('#logout').onclick=()=>{localStorage.removeItem('schoolPortalUser');auth.signOut().then(()=>location.reload())};nav();init();</script><script src="community.js"></script></body></html>
