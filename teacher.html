<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPNHS Teacher</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#0b5ed7;color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}header .brand{font-weight:800;font-size:19px}main{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(20,45,80,.08)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:10px 11px;border:1px solid #cdd7e5;border-radius:8px;background:white}button{border:0;border-radius:8px;padding:10px 14px;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#52647a}button.success{background:#16864a}button.danger{background:#c62828}.hide{display:none!important}.msg{padding:10px;border-radius:8px;background:#eef5ff;margin-top:10px}.error{background:#ffe8e8;color:#8a1c1c}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f1ff;color:#0b5ed7;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eff7;color:#172033}.tab.active{background:#0b5ed7;color:#fff}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border:1px solid #dbe2eb;padding:8px;text-align:left;font-size:13px}th{background:#f2f6fb} .table-wrap{overflow:auto}.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.feature{border:1px solid #dbe2eb;padding:10px;border-radius:9px}.feature input{width:auto}.login{max-width:430px;margin:70px auto}.notice{padding:12px;border-left:4px solid #0b5ed7;background:#f2f7ff}.danger-text{color:#b71c1c}.small{font-size:12px;color:#65748a}.right{text-align:right}@media(max-width:600px){main{padding:10px}.card{padding:15px}header{padding:14px}.login{margin:30px 10px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script>const FIREBASE_CONFIG={apiKey:"AIzaSyDIm2towADazJ9yuhUaIzVfX7ZaQEFbCpI",authDomain:"jpnhs-a2ba2.firebaseapp.com",databaseURL:"https://jpnhs-a2ba2-default-rtdb.firebaseio.com/",projectId:"jpnhs-a2ba2",storageBucket:"jpnhs-a2ba2.firebasestorage.app",messagingSenderId:"689552509381",appId:"1:689552509381:web:98d043fc17189a636ea3ac"};
const SCHOOL_ID="JPNHS-001", ADMIN_EMAIL="christiandavealbana92@gmail.com";
firebase.initializeApp(FIREBASE_CONFIG); const db=firebase.database(), auth=firebase.auth();
function today(){return new Date().toISOString().slice(0,10)}
async function getSchool(){return (await db.ref('schools/'+SCHOOL_ID).once('value')).val()||{name:'Juan Pamplona National High School',schoolYear:'2026-2027',gradingSystem:'4Q',plan:'STANDARD',expires:'2099-12-31',closed:false,features:{student:true,teacher:true,registrar:true,pdfReportCard:true,attendance:true,coreValues:true,excelExport:true,archive:true,sms:false,parent:false,onlineEnrollment:false}}}
function closedCheck(s){return !!s.closed || (s.expires && s.expires<today())}
function goClosed(){location.href='closed.html'}
function periods(g){return g==='4Q'?['Q1','Q2','Q3','Q4','Final']:g==='2SEM'?['SEM1','SEM2','Final']:['T1','T2','T3','Final']}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const CORE_VALUES=['Maka-Diyos: Expresses one’s spiritual beliefs while respecting the spiritual beliefs of others','Maka-Diyos: Shows adherence to ethical principles by upholding truth','Maka-Diyos: Demonstrates respect for the rights and beliefs of others','Makatao: Is sensitive to individual, social, and cultural differences','Makatao: Demonstrates contributions toward solidarity','Makatao: Respects others and their rights','Makakalikasan: Cares for the environment and utilizes resources wisely','Makakalikasan: Practices waste segregation and conservation','Makakalikasan: Participates in activities that protect the environment','Makabansa: Demonstrates pride in being a Filipino','Makabansa: Promotes the appreciation of Filipino culture and heritage','Makabansa: Contributes to the community and nation'];
const MONTHS=['June','July','August','September','October','November','December','January','February','March'];
function coreTable(values={},editable=false){return '<table><thead><tr><th>Core Value / Indicator</th><th>Rating</th></tr></thead><tbody>'+CORE_VALUES.map((v,i)=>'<tr><td>'+esc(v)+'</td><td>'+(editable?'<select data-core="'+i+'"><option value="NOT OBSERVED">NOT OBSERVED</option><option value="RARELY">RARELY</option><option value="SOMETIMES">SOMETIMES</option><option value="OFTEN">OFTEN</option><option value="ALWAYS">ALWAYS</option></select>':esc(values[i]||'NOT OBSERVED'))+'</td></tr>').join('')+'</tbody></table>'}
function attendanceTable(a={},editable=false){return '<table><thead><tr><th>Month</th><th>Present</th><th>Absent</th></tr></thead><tbody>'+MONTHS.map(m=>'<tr><td>'+m+'</td><td>'+(editable?'<input type="number" min="0" data-present="'+m+'" value="'+Number(a[m]?.present||0)+'">':Number(a[m]?.present||0))+'</td><td>'+(editable?'<input type="number" min="0" data-absent="'+m+'" value="'+Number(a[m]?.absent||0)+'">':Number(a[m]?.absent||0))+'</td></tr>').join('')+'</tbody><tfoot><tr><th>Total</th><th>'+MONTHS.reduce((n,m)=>n+Number(a[m]?.present||0),0)+'</th><th>'+MONTHS.reduce((n,m)=>n+Number(a[m]?.absent||0),0)+'</th></tr></tfoot></table>'}

let school={},teacherUser={},assignments=[],students=[];async function loginT(){try{school=await getSchool();if(!school.features?.teacher)throw Error('Teacher Portal is OFF.');if(closedCheck(school)){goClosed();return}const id=tid.value.trim().toUpperCase(),st=(await db.ref('staff/'+SCHOOL_ID+'/teachers/'+id).once('value')).val();if(!st||st.active===false)throw Error('Teacher account not found or blocked.');await auth.signInWithEmailAndPassword(st.email,pw.value);teacherUser=st;login.classList.add('hide');app.classList.remove('hide');schoolTitle.textContent=school.name||'JPNHS';grading.value=school.gradingSystem;await loadAssignments()}catch(e){loginMsg.className='msg error';loginMsg.textContent=e.message}}
async function loadAssignments(){const v=(await db.ref('sectionAssignments/'+SCHOOL_ID).once('value')).val()||{};assignments=Object.values(v).filter(a=>a.teacherId===teacherUser.id);const pairs=[...new Map(assignments.map(a=>[a.section+'||'+a.subject,a])).values()];subject.innerHTML=[...new Set(pairs.map(a=>a.subject))].sort().map(x=>'<option>'+esc(x)+'</option>').join('')||'<option>No assigned subjects</option>';section.innerHTML=[...new Set(pairs.map(a=>a.section))].sort().map(x=>'<option>'+esc(x)+'</option>').join('')||'<option>No assigned sections</option>'}
function assigned(){return assignments.some(a=>a.teacherId===teacherUser.id&&a.section===section.value&&a.subject===subject.value)}
async function loadClass(){try{if(!assigned())throw Error('This teacher is not assigned to this section/subject.');const all=(await db.ref('students/'+SCHOOL_ID).once('value')).val()||{},blocked=await db.ref('blockedSections/'+SCHOOL_ID+'/'+btoa(unescape(encodeURIComponent(section.value))).replace(/=/g,'')).once('value');if(blocked.val())throw Error('This section is blocked.');students=Object.values(all).filter(s=>s.section===section.value&&s.schoolYear===school.schoolYear);const ps=periods(school.gradingSystem);gradeTable.querySelector('thead').innerHTML='<tr><th>Student</th>'+ps.map(p=>'<th>'+p+'</th>').join('')+'</tr>';gradeTable.querySelector('tbody').innerHTML=students.map((s,i)=>'<tr><td>'+esc(s.studentId)+' — '+esc(s.name)+'</td>'+ps.map(p=>'<td><input type="number" min="0" max="100" id="g_'+i+'_'+p+'" value="'+esc(s.grades?.[subject.value]?.[p]??'')+'"></td>').join('')+'</tr>').join('');coreBox.innerHTML=students.map((s,i)=>'<div class="card"><b>'+esc(s.name)+'</b>'+coreTable(s.coreValues,true)+'</div>').join('');attBox.innerHTML=students.map((s,i)=>'<div class="card"><b>'+esc(s.name)+'</b>'+attendanceTable(s.attendance,true)+'</div>').join('')}catch(e){teacherMsg.className='msg error';teacherMsg.textContent=e.message}}
function collectCore(card){const o={};card.querySelectorAll('[data-core]').forEach(x=>o[x.dataset.core]=x.value);return o}function collectAtt(card){const o={};MONTHS.forEach(m=>o[m]={present:Number(card.querySelector('[data-present="'+m+'"]').value)||0,absent:Number(card.querySelector('[data-absent="'+m+'"]').value)||0});return o}
async function saveGrades(){try{if(!students.length)throw Error('Load a class first.');const ps=periods(school.gradingSystem),cards=coreBox.querySelectorAll('.card'),attCards=attBox.querySelectorAll('.card');for(let i=0;i<students.length;i++){const grades={...(students[i].grades||{})};grades[subject.value]={...(grades[subject.value]||{})};ps.forEach(p=>grades[subject.value][p]=Number(document.getElementById('g_'+i+'_'+p).value)||0);await db.ref('students/'+SCHOOL_ID+'/'+students[i].studentId).update({grades,coreValues:collectCore(cards[i]),attendance:collectAtt(attCards[i])})}alert('Grades, core values and attendance saved.');await loadClass()}catch(e){teacherMsg.className='msg error';teacherMsg.textContent=e.message}}
function makeReport(s){const ps=periods(school.gradingSystem),subs=Object.keys(s.grades||{});let total=0,count=0;let rows=subs.map(sub=>{const g=s.grades[sub]||{};const vals=ps.map(p=>Number(g[p]||0));const final=Number(g.Final||0);if(final>0){total+=final;count++}return '<tr><td>'+esc(sub)+'</td>'+ps.map(p=>'<td>'+esc(g[p]??'')+'</td>').join('')+'</tr>'}).join('');const avg=count?total/count:0;return {p1:'<h1>'+esc(school.name)+'</h1><h3>STUDENT REPORT CARD</h3><p><b>Student ID:</b> '+esc(s.studentId)+' &nbsp; <b>School Year:</b> '+esc(s.schoolYear)+'</p><p><b>Name:</b> '+esc(s.name)+'</p><p><b>Level:</b> '+esc(s.level)+' &nbsp; <b>Section:</b> '+esc(s.section)+'</p><h3>Grades</h3><table><tr><th>Subject</th>'+ps.map(p=>'<th>'+p+'</th>').join('')+'</tr>'+rows+'</table><h3>General Average: '+(avg?avg.toFixed(2):'—')+'</h3><p>Remarks: '+(avg>=75?'PASSED':'For evaluation / no final grades')+'</p><p style="margin-top:70px">Class Adviser: __________________________ &nbsp; Principal: __________________________</p>',p2:'<h1>'+esc(school.name)+'</h1><h3>CORE VALUES</h3>'+coreTable(s.coreValues,false)+'<h3>ATTENDANCE</h3>'+attendanceTable(s.attendance,false)} }
async function pdfTwo(s,file){const r=makeReport(s),els=[r.p1,r.p2],pdf=new jspdf.jsPDF('p','mm','a4');for(let i=0;i<2;i++){const el=document.createElement('div');el.style.cssText='position:absolute;left:-10000px;top:0;width:700px;background:#fff;padding:30px;font-family:Arial;font-size:12px';el.innerHTML=els[i];document.body.appendChild(el);const c=await html2canvas(el,{scale:1.5,backgroundColor:'#fff'});if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/png'),'PNG',8,8,194,281);el.remove()}pdf.save(file)}
async function printGradeSheet(){if(students.length)await pdfTwo(students[0],'Grade-Sheet-'+school.schoolYear+'.pdf');else alert('Load a class first.')}function downloadGrades(){if(!students.length)return alert('Load a class first.');const ps=periods(school.gradingSystem),rows=students.map((s,i)=>{const r={StudentID:s.studentId,Name:s.name,Section:s.section};ps.forEach(p=>r[p]=document.getElementById('g_'+i+'_'+p)?.value||'');return r});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Grades');XLSX.writeFile(wb,'Grades-'+school.schoolYear+'-'+section.value+'.xlsx')}async function printOneReport(){if(students.length)await pdfTwo(students[0],'Report-Card-'+students[0].studentId+'.pdf');else alert('Load a class first.')}</script></head><body><div id="login" class="card login"><h2>Teacher Portal</h2><label>Teacher ID</label><input id="tid" placeholder="T-0001"><label>Password</label><input id="pw" type="password"><button onclick="loginT()">Sign In</button><div id="loginMsg"></div></div><div id="app" class="hide"><header><div><div class="brand" id="schoolTitle">JPNHS</div><div>Teacher Portal</div></div><button class="secondary" onclick="auth.signOut().then(()=>location.reload())">Sign Out</button></header><main><div class="card"><div class="grid"><div><label>Subject</label><select id="subject"></select></div><div><label>Section</label><select id="section"></select></div><div><label>Grading System</label><input id="grading" readonly></div></div><button onclick="loadClass()">Load Class</button><div id="teacherMsg"></div></div><div class="card"><h2>Grades</h2><div class="table-wrap"><table id="gradeTable"><thead></thead><tbody></tbody></table></div></div><div class="card"><h2>Core Values</h2><div id="coreBox"></div></div><div class="card"><h2>Attendance — June to March</h2><div id="attBox"></div></div><div class="card"><button onclick="saveGrades()">Save to Firebase</button><button onclick="printGradeSheet()">Print Grade Sheet as PDF</button><button onclick="downloadGrades()">Download Grades as Excel</button><button onclick="printOneReport()">Print 1 Student Report Card as PDF</button></div></main></div></body></html>
