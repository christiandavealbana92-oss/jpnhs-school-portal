<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student</title><style>
:root{--blue:#0757a5;--blue2:#0b74d1;--ink:#132238;--muted:#65758b;--line:#dce5ef;--bg:#f4f7fb;--white:#fff;--danger:#c62828;--ok:#16834b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{max-width:1400px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:230px}.logo{width:42px;height:42px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 67px)}.side{background:#fff;border-right:1px solid var(--line);padding:16px}.side button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#405169;margin-bottom:4px}.side button.active,.side button:hover{background:#eaf3fd;color:var(--blue);font-weight:700}.main{padding:22px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #1a365d08}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#52637a}.field input,.field select,.field textarea{border:1px solid #ccd8e6;border-radius:8px;padding:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0b74d118}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#eef4fa;color:#1e4f7f}.btn.danger{background:#c62828}.btn.success{background:#16834b}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat strong{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted)}.notice{padding:12px;border-radius:8px;background:#eef7ff;border:1px solid #cfe4f8;margin-bottom:14px}.notice.warn{background:#fff7e6;border-color:#f2d28c}.notice.error{background:#fff0f0;border-color:#f0bcbc;color:#8d2020}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f6f9fc;color:#42566e}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#edf4fb;color:#35658d}.pill.ok{background:#e9f7ef;color:#16834b}.pill.bad{background:#fff0f0;color:#c62828}.switch{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}.switch input{width:18px;height:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf5ff,#fff)}.loginbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 15px 50px #15365d18}.loginbox .logo{margin-bottom:12px}.loginbox h1{margin:6px 0}.hidden{display:none!important}.report{background:#fff;color:#111;padding:28px;width:100%;max-width:900px;margin:auto}.report header{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px}.report .rlogo{width:50px;height:50px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.report h2{margin:4px 0;font-size:18px}.report table{width:100%;border-collapse:collapse;margin:12px 0}.report th,.report td{border:1px solid #777;padding:6px;font-size:11px}.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px;text-align:center}.sig div{border-top:1px solid #333;padding-top:5px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:18px}.search{max-width:380px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:5px}.side button{min-width:max-content}.grid,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topin{flex-wrap:wrap}.brand{min-width:0}.top-actions{width:100%;margin-left:0}.grid,.grid2,.stats{grid-template-columns:1fr}.main{padding:12px}.sig{grid-template-columns:1fr}.report{padding:15px}}
.logo img,.brand-img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff}.portal-partners{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.partner-caption{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.portal-partner{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:#fff;font-size:10px;white-space:nowrap}.portal-partner img{width:22px;height:22px;object-fit:contain}.report-brand{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px}.report-brand .rlogo{background:#fff}.report-logo{width:50px;height:50px;object-fit:contain}.report-partners{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}.report-partners span{display:inline-flex;align-items:center;gap:5px;font-size:9px}.report-partners img{width:24px;height:24px;object-fit:contain}.loginbox .logo img{width:100%;height:100%;object-fit:contain}@media(max-width:700px){.portal-partners{width:100%;margin-left:0;justify-content:flex-start}.portal-partner b{display:none}}

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head><body><div class="login" id="login"><div class="loginbox"><div class="logo" data-school-logo>SP</div><h1 data-school-name>School Portal</h1><p class="muted">Student Portal</p><div class="field"><label>Student ID</label><input id="sid" placeholder="G7-2026-0001"></div><div class="field" style="margin-top:10px"><label>Birthday</label><input id="bd" type="date"></div><button class="btn" style="margin-top:14px;width:100%" id="slogin">View Portal</button><p id="lm" class="notice hidden"></p></div></div><div id="app" class="hidden"><div class="top"><div class="topin"><div class="brand"><div class="logo" data-school-logo>SP</div><div><b>Student Portal</b><small data-school-name></small></div></div><button class="btn secondary" id="logout">Logout</button></div></div><div class="layout"><aside class="side"><button class="active" data-page="home">Dashboard</button><button data-page="grades">Grades</button><button data-page="values">Core Values</button><button data-page="attendance">Attendance</button><button data-page="report">Report Card</button></aside><main class="main"><section id="home" class="page active"><div class="card"><h2 id="studentName"></h2><div class="grid"><div><span class="muted">Student ID</span><br><b id="studentID"></b></div><div><span class="muted">Level</span><br><b id="level"></b></div><div><span class="muted">Section</span><br><b id="section"></b></div><div><span class="muted">School Year</span><br><b id="sy"></b></div></div></div></section><section id="grades" class="page"><div class="card"><h2>Grades</h2><div class="tablewrap"><table class="table" id="gradeTable"></table></div><p><b>General Average:</b> <span id="avg"></span> <span id="remarks" class="pill"></span></p></div></section><section id="values" class="page"><div class="card"><h2>Core Values</h2><div class="tablewrap"><table class="table" id="valueTable"></table></div></div></section><section id="attendance" class="page"><div class="card"><h2>Attendance</h2><div class="tablewrap"><table class="table" id="attTable"></table></div></div></section><section id="report" class="page"><div class="card"><h2>Report Card</h2><p>Generate a clean two-page report card containing grades, general average, core values and attendance.</p><button class="btn" id="pdf">Download 2 Page Report Card as PDF</button></div></section></main></div></div><script>
const firebaseConfig = {
  apiKey: "AIzaSyDIm2towADazJ9yuhUaIzVfX7ZaQEFbCpI",
  authDomain: "jpnhs-a2ba2.firebaseapp.com",
  databaseURL: "https://jpnhs-a2ba2-default-rtdb.firebaseio.com",
  projectId: "jpnhs-a2ba2",
  storageBucket: "jpnhs-a2ba2.firebasestorage.app",
  messagingSenderId: "689552509381",
  appId: "1:689552509381:web:98d043fc17189a636ea3ac"
};

firebase.initializeApp(firebaseConfig); const db=firebase.database(), auth=firebase.auth();
const qs=new URLSearchParams(location.search); const SCHOOL_ID=qs.get('school')||localStorage.getItem('schoolID')||'jpnhs';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const gradingTerms={'4Q':['Q1','Q2','Q3','Q4','Final'],'2SEM':['SEM1','SEM2','Final'],'3TRIM':['T1','T2','T3','Final']};
const depedValues=['Maka-Diyos','Makatao','Makakalikasan','Makabansa','Respect for Human Dignity','Respect for Others','Peace and Order','Justice','Honesty','Love of Country','Care for the Environment','Self-Discipline'];
async function school(){let s=(await db.ref('schools/'+SCHOOL_ID).once('value')).val();if(!s)throw Error('School configuration not found. Create it in Administrator first.');if(s.expires&&s.expires<today()&&!location.pathname.endsWith('closed.html')){location.href='closed.html';return null}return s}
function brandingInitials(name){return String(name||'School Portal').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'SP'}
function brandingPartners(s){const p=s?.partners;if(Array.isArray(p))return p;if(p&&typeof p==='object')return Object.values(p);return []}
function brandLogoHTML(s,cls='brand-img'){return s?.logo?`<img class="${cls}" src="${esc(s.logo)}" alt="School logo">`:esc(brandingInitials(s?.shortName||s?.name))}
function partnerStripHTML(s){const ps=brandingPartners(s);if(!ps.length)return '';return `<div class="portal-partners"><span class="partner-caption">Partners</span>${ps.map(p=>`<span class="portal-partner" title="${esc(p.name||'Partner')}">${p.logo?`<img src="${esc(p.logo)}" alt="">`:esc(brandingInitials(p.name))}<b>${esc(p.name||'Partner')}</b></span>`).join('')}</div>`}
function reportBrandHeader(s,title){const ps=brandingPartners(s);return `<header class="report-brand"><div class="rlogo">${brandLogoHTML(s,'report-logo')}</div><div><h2>${esc(s?.name||'School Portal')}</h2><div>${esc(title)}</div></div></header>${ps.length?`<div class="report-partners">${ps.map(p=>`<span>${p.logo?`<img src="${esc(p.logo)}" alt="">`:esc(brandingInitials(p.name))}<b>${esc(p.name||'Partner')}</b></span>`).join('')}</div>`:''}`}
function setBrand(s){$$('[data-school-name]').forEach(x=>x.textContent=s?.name||'School Portal');$$('[data-school-logo]').forEach(x=>x.innerHTML=brandLogoHTML(s));let host=document.querySelector('.topin');if(host&&!host.querySelector('.portal-partners')){const d=document.createElement('div');d.innerHTML=partnerStripHTML(s);const el=d.firstElementChild;if(el)host.appendChild(el)}}
function termsSelect(el,g){el.innerHTML=(gradingTerms[g]||[]).map(x=>`<option value="${x}">${x}</option>`).join('')}
function gradeAverage(grades){let a=[];Object.values(grades||{}).forEach(g=>Object.values(g||{}).forEach(v=>{if(v!==''&&v!=null&&!isNaN(+v)&&+v<=100)a.push(+v)}));return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function calcFinal(vals){let nums=vals.filter(v=>v!==''&&!isNaN(+v)).map(Number);return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):''}
function downloadExcel(rows,name){let ws=XLSX.utils.json_to_sheet(rows);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,name)}
function pdfFrom(el,name,landscape=false){return html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{const {jsPDF}=window.jspdf;let pdf=new jsPDF(landscape?'l':'p','mm','a4');let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight();let ratio=Math.min((w-10)/c.width,(h-10)/c.height);pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*ratio,c.height*ratio);pdf.save(name)})}
function twoPagePDF(p1,p2,name){const {jsPDF}=window.jspdf;let pdf=new jsPDF('p','mm','a4');[p1,p2].forEach((el,i)=>{html2canvas(el,{scale:1.5,backgroundColor:'#fff'}).then(c=>{let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight(),r=Math.min((w-10)/c.width,(h-10)/c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*r,c.height*r);if(i===1)pdf.save(name)})})}
function nav(){ $$('.side button').forEach(b=>b.onclick=()=>{$$('.page').forEach(p=>p.classList.remove('active'));$('#'+b.dataset.page)?.classList.add('active');$$('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}) }
</script><script>let S,ST;async function init(){try{S=await school();if(!S)return;setBrand(S);if(S.open===false||S.features?.student!==true)throw Error('Student Portal is closed or disabled.');}catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}}$('#slogin').onclick=async()=>{try{let id=$('#sid').value.trim(),bd=$('#bd').value;if(!id||!bd)throw Error('Student ID and birthday are required.');let s=(await db.ref('studentsBySchool/'+SCHOOL_ID+'/'+id).once('value')).val();if(!s||s.birthday!==bd)throw Error('Student record not found or birthday does not match.');ST=s;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){$('#lm').textContent=e.message;$('#lm').classList.remove('hidden')}};
function render(){$('#studentName').textContent=ST.name;$('#studentID').textContent=ST.studentID;$('#level').textContent=ST.level;$('#section').textContent=ST.section;$('#sy').textContent=ST.schoolYear;let heads=gradingTerms[S.gradingSystem],subs=Object.keys(ST.grades||{});$('#gradeTable').innerHTML='<tr><th>Subject</th>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+subs.map(s=>'<tr><td>'+esc(s)+'</td>'+heads.map(h=>'<td>'+esc(ST.grades[s]?.[h]??'')+'</td>').join('')+'</tr>').join('');let av=gradeAverage(ST.grades);$('#avg').textContent=av?av.toFixed(2):'—';$('#remarks').textContent=av?(av>=75?'PASSED':'FAILED'):'—';let cv=ST.coreValues||{};$('#valueTable').innerHTML='<tr><th>Core Value</th><th>Rating</th></tr>'+depedValues.map(v=>'<tr><td>'+esc(v)+'</td><td>'+esc(cv[v]||'NOT OBSERVED')+'</td></tr>').join('');let a=ST.attendance||{};$('#attTable').innerHTML='<tr><th>Month</th><th>Present</th><th>Absent</th></tr>'+months.map(m=>'<tr><td>'+m+'</td><td>'+((a[m]||{}).present||0)+'</td><td>'+((a[m]||{}).absent||0)+'</td></tr>').join('')+'<tr><th>Total</th><th>'+((a.totalPresent)||0)+'</th><th>'+((a.totalAbsent)||0)+'</th></tr>'}
function p1(){let heads=gradingTerms[S.gradingSystem],subs=Object.keys(ST.grades||{}),av=gradeAverage(ST.grades);return `<div class="report">${reportBrandHeader(S,'Student Report Card — '+ST.schoolYear)}<p><b>Student ID:</b> ${esc(ST.studentID)}<br><b>Name:</b> ${esc(ST.name)}<br><b>Level:</b> ${esc(ST.level)} &nbsp; <b>Section:</b> ${esc(ST.section)}</p><table><tr><th>Subject</th>${heads.map(h=>'<th>'+h+'</th>').join('')}</tr>${subs.map(s=>'<tr><td>'+esc(s)+'</td>'+heads.map(h=>'<td>'+esc(ST.grades[s]?.[h]??'')+'</td>').join('')+'</tr>').join('')}</table><p><b>General Average:</b> ${av?av.toFixed(2):'—'} &nbsp; <b>Remarks:</b> ${av>=75?'PASSED':'—'}</p><div class="sig"><div>Class Adviser</div><div>School Principal</div><div>Parent/Guardian</div></div></div>`}function p2(){let cv=ST.coreValues||{},a=ST.attendance||{};return `<div class="report">${reportBrandHeader(S,'Student Report Card — Page 2')}<h3>Core Values</h3><table><tr><th>Value</th><th>Rating</th></tr>${depedValues.map(v=>'<tr><td>'+esc(v)+'</td><td>'+esc(cv[v]||'NOT OBSERVED')+'</td></tr>').join('')}</table><h3>Attendance Summary</h3><table><tr><th>Month</th><th>Present</th><th>Absent</th></tr>${months.map(m=>'<tr><td>'+m+'</td><td>'+((a[m]||{}).present||0)+'</td><td>'+((a[m]||{}).absent||0)+'</td></tr>').join('')}<tr><th>Total</th><th>${a.totalPresent||0}</th><th>${a.totalAbsent||0}</th></tr></table></div>`}$('#pdf').onclick=async()=>{if(!S.features?.pdfReportCard)return alert('PDF Report Card is disabled.');let holder=document.createElement('div');holder.style.position='absolute';holder.style.left='-99999px';holder.innerHTML=p1()+p2();document.body.appendChild(holder);let els=holder.querySelectorAll('.report'),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');for(let i=0;i<2;i++){let c=await html2canvas(els[i],{scale:1.5,backgroundColor:'#fff'});let w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight(),r=Math.min((w-10)/c.width,(h-10)/c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',5,5,c.width*r,c.height*r)}pdf.save(ST.studentID+'-report-card.pdf');holder.remove()};$('#logout').onclick=()=>location.reload();nav();init();</script></body></html>
