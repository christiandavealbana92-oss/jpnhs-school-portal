<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPNHS Offline Archive</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#0b5ed7;color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}header .brand{font-weight:800;font-size:19px}main{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(20,45,80,.08)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:10px 11px;border:1px solid #cdd7e5;border-radius:8px;background:white}button{border:0;border-radius:8px;padding:10px 14px;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#52647a}button.success{background:#16864a}button.danger{background:#c62828}.hide{display:none!important}.msg{padding:10px;border-radius:8px;background:#eef5ff;margin-top:10px}.error{background:#ffe8e8;color:#8a1c1c}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f1ff;color:#0b5ed7;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eff7;color:#172033}.tab.active{background:#0b5ed7;color:#fff}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border:1px solid #dbe2eb;padding:8px;text-align:left;font-size:13px}th{background:#f2f6fb} .table-wrap{overflow:auto}.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.feature{border:1px solid #dbe2eb;padding:10px;border-radius:9px}.feature input{width:auto}.login{max-width:430px;margin:70px auto}.notice{padding:12px;border-left:4px solid #0b5ed7;background:#f2f7ff}.danger-text{color:#b71c1c}.small{font-size:12px;color:#65748a}.right{text-align:right}@media(max-width:600px){main{padding:10px}.card{padding:15px}header{padding:14px}.login{margin:30px 10px}}</style><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>const MONTHS=['June','July','August','September','October','November','December','January','February','March'];const CORE_VALUES=['Maka-Diyos: Expresses one’s spiritual beliefs while respecting the spiritual beliefs of others','Maka-Diyos: Shows adherence to ethical principles by upholding truth','Maka-Diyos: Demonstrates respect for the rights and beliefs of others','Makatao: Is sensitive to individual, social, and cultural differences','Makatao: Demonstrates contributions toward solidarity','Makatao: Respects others and their rights','Makakalikasan: Cares for the environment and utilizes resources wisely','Makakalikasan: Practices waste segregation and conservation','Makakalikasan: Participates in activities that protect the environment','Makabansa: Demonstrates pride in being a Filipino','Makabansa: Promotes the appreciation of Filipino culture and heritage','Makabansa: Contributes to the community and nation'];let rows=[],found=null,settings={};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function periods(g){return g==='4Q'?['Q1','Q2','Q3','Q4','Final']:g==='2SEM'?['SEM1','SEM2','Final']:['T1','T2','T3','Final']}function parseJSON(v){try{return JSON.parse(v||'{}')}catch{return {}}}function coreTable(v){return '<table><tr><th>Core Value / Indicator</th><th>Rating</th></tr>'+CORE_VALUES.map((x,i)=>'<tr><td>'+esc(x)+'</td><td>'+esc(v[i]||'NOT OBSERVED')+'</td></tr>').join('')+'</table>'}function attTable(v){return '<table><tr><th>Month</th><th>Present</th><th>Absent</th></tr>'+MONTHS.map(m=>'<tr><td>'+m+'</td><td>'+Number(v[m]?.present||0)+'</td><td>'+Number(v[m]?.absent||0)+'</td></tr>').join('')+'</table><p><b>Total Present:</b> '+MONTHS.reduce((n,m)=>n+Number(v[m]?.present||0),0)+' &nbsp; <b>Total Absent:</b> '+MONTHS.reduce((n,m)=>n+Number(v[m]?.absent||0),0)+'</p>'}function loadFile(){if(!file.files[0])return alert('Choose an Excel backup file.');const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames.includes('Students')?'Students':wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});const sw=wb.Sheets['Settings'];if(sw)settings=XLSX.utils.sheet_to_json(sw,{defval:''})[0]||{};backupYear.innerHTML=[...new Set(rows.map(x=>x.SchoolYear).filter(Boolean))].map(y=>'<option>'+esc(y)+'</option>').join('');app.classList.remove('hide');msg.className='msg';msg.textContent='Loaded '+rows.length.toLocaleString()+' student records. Data remains only in this page.'}catch(e){msg.className='msg error';msg.textContent='Could not read backup: '+e.message}};r.readAsArrayBuffer(file.files[0])}function searchStudent(){const id=sid.value.trim().toUpperCase();found=rows.find(x=>String(x.StudentID).toUpperCase()===id&&(!backupYear.value||String(x.SchoolYear)===backupYear.value));if(!found){result.innerHTML='<p class="danger-text">Student not found.</p>';return}const g=parseJSON(found.Grades),cv=parseJSON(found.CoreValues),a=parseJSON(found.Attendance),ps=periods(found.GradingSystem||settings.GradingSystem||'4Q');let total=0,count=0;const subs=Object.keys(g),gradeRows=subs.map(sub=>{const z=g[sub]||{},f=Number(z.Final||0);if(f){total+=f;count++}return '<tr><td>'+esc(sub)+'</td>'+ps.map(p=>'<td>'+esc(z[p]??'')+'</td>').join('')+'</tr>'}).join('');const avg=count?total/count:0;result.innerHTML='<h2>'+esc(found.Name)+'</h2><p><b>Student ID:</b> '+esc(found.StudentID)+' · <b>Level:</b> '+esc(found.Level)+' · <b>Section:</b> '+esc(found.Section)+' · <b>School Year:</b> '+esc(found.SchoolYear)+'</p><h3>Grades</h3><div class="table-wrap"><table><tr><th>Subject</th>'+ps.map(p=>'<th>'+p+'</th>').join('')+'</tr>'+gradeRows+'</table></div><p><b>General Average:</b> '+(avg?avg.toFixed(2):'—')+'</p><h3>Core Values</h3><div class="table-wrap">'+coreTable(cv)+'</div><h3>Attendance</h3><div class="table-wrap">'+attTable(a)+'</div>'}async function printPdf(){if(!found)return alert('Search a student first.');const g=parseJSON(found.Grades),cv=parseJSON(found.CoreValues),a=parseJSON(found.Attendance),ps=periods(found.GradingSystem||settings.GradingSystem||'4Q');let total=0,count=0;const gradeRows=Object.keys(g).map(sub=>{const z=g[sub]||{},f=Number(z.Final||0);if(f){total+=f;count++}return '<tr><td>'+esc(sub)+'</td>'+ps.map(p=>'<td>'+esc(z[p]??'')+'</td>').join('')+'</tr>'}).join('');const avg=count?total/count:0;const schoolName=settings.SchoolName||'JPNHS';const pages=['<h1>'+esc(schoolName)+'</h1><h3>STUDENT REPORT CARD — ARCHIVE</h3><p><b>Student ID:</b> '+esc(found.StudentID)+' &nbsp; <b>School Year:</b> '+esc(found.SchoolYear)+'</p><p><b>Name:</b> '+esc(found.Name)+'</p><p><b>Level:</b> '+esc(found.Level)+' &nbsp; <b>Section:</b> '+esc(found.Section)+'</p><h3>Grades</h3><table><tr><th>Subject</th>'+ps.map(p=>'<th>'+p+'</th>').join('')+'</tr>'+gradeRows+'</table><h3>General Average: '+(avg?avg.toFixed(2):'—')+'</h3><p>Remarks: '+(avg>=75?'PASSED':'For evaluation / no final grades')+'</p><p style="margin-top:70px">Class Adviser: __________________________ &nbsp; Principal: __________________________</p>','<h1>'+esc(schoolName)+'</h1><h3>CORE VALUES</h3>'+coreTable(cv)+'<h3>ATTENDANCE</h3>'+attTable(a)];const pdf=new jspdf.jsPDF('p','mm','a4');for(let i=0;i<2;i++){const el=document.createElement('div');el.style.cssText='position:absolute;left:-10000px;top:0;width:700px;background:#fff;padding:30px;font-family:Arial;font-size:12px';el.innerHTML=pages[i];document.body.appendChild(el);const c=await html2canvas(el,{scale:1.5,backgroundColor:'#fff'});if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/png'),'PNG',8,8,194,281);el.remove()}pdf.save('Archive-Report-'+found.StudentID+'.pdf')}</script></head><body><header><div><div class="brand">JPNHS — Student Archive Portal</div><div>Offline backup viewer · No Firebase connection</div></div></header><main><div class="card"><h2>Upload School Excel Backup</h2><p class="small">Your backup stays in this browser tab only. Nothing is uploaded to a server.</p><input id="file" type="file" accept=".xlsx,.xls"><button onclick="loadFile()">Upload & Read Backup</button><div id="msg"></div></div><div id="app" class="hide"><div class="card"><div class="grid"><div><label>School Year</label><select id="backupYear"></select></div><div><label>Student ID</label><input id="sid" placeholder="G7-2026-0001"></div></div><button onclick="searchStudent()">Search</button><button onclick="printPdf()">Print Search Result as PDF</button></div><div id="result" class="card"></div></div></main></body></html>
