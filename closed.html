<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--blue:#0757a5;--blue2:#0b74d1;--ink:#132238;--muted:#65758b;--line:#dce5ef;--bg:#f4f7fb;--white:#fff;--danger:#c62828;--ok:#16834b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{max-width:1400px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:230px}.logo{width:42px;height:42px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 67px)}.side{background:#fff;border-right:1px solid var(--line);padding:16px}.side button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#405169;margin-bottom:4px}.side button.active,.side button:hover{background:#eaf3fd;color:var(--blue);font-weight:700}.main{padding:22px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #1a365d08}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#52637a}.field input,.field select,.field textarea{border:1px solid #ccd8e6;border-radius:8px;padding:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0b74d118}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#eef4fa;color:#1e4f7f}.btn.danger{background:#c62828}.btn.success{background:#16834b}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat strong{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted)}.notice{padding:12px;border-radius:8px;background:#eef7ff;border:1px solid #cfe4f8;margin-bottom:14px}.notice.warn{background:#fff7e6;border-color:#f2d28c}.notice.error{background:#fff0f0;border-color:#f0bcbc;color:#8d2020}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f6f9fc;color:#42566e}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#edf4fb;color:#35658d}.pill.ok{background:#e9f7ef;color:#16834b}.pill.bad{background:#fff0f0;color:#c62828}.switch{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}.switch input{width:18px;height:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf5ff,#fff)}.loginbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 15px 50px #15365d18}.loginbox .logo{margin-bottom:12px}.loginbox h1{margin:6px 0}.hidden{display:none!important}.report{background:#fff;color:#111;padding:28px;width:100%;max-width:900px;margin:auto}.report header{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px}.report .rlogo{width:50px;height:50px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.report h2{margin:4px 0;font-size:18px}.report table{width:100%;border-collapse:collapse;margin:12px 0}.report th,.report td{border:1px solid #777;padding:6px;font-size:11px}.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px;text-align:center}.sig div{border-top:1px solid #333;padding-top:5px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:18px}.search{max-width:380px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:5px}.side button{min-width:max-content}.grid,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topin{flex-wrap:wrap}.brand{min-width:0}.top-actions{width:100%;margin-left:0}.grid,.grid2,.stats{grid-template-columns:1fr}.main{padding:12px}.sig{grid-template-columns:1fr}.report{padding:15px}}
</style></head><body><div class="login"><div class="loginbox" style="text-align:center"><div class="logo" style="margin:auto">SP</div><h1>Portal Closed</h1><p class="muted">Please renew your subscription to continue using this school portal.</p></div></div></body></html>
