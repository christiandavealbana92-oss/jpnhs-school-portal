<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VA Access</title><style>:root{--b:#2563eb;--m:#7f1d2d;--ink:#172033;--mut:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;color:var(--ink);background:linear-gradient(135deg,#eef6ff,#fff 60%,#fff5f6);min-height:100vh}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 15px 45px #0f172a0c}.box{width:min(430px,100%)}main{max-width:1100px;margin:auto;padding:25px 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}.btn.m{background:var(--m)}.btn.s{background:#eef4fa;color:#234f7c}.actions{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;margin:12px 0}.error{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.hidden{display:none}.switch{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#ecfdf3;color:#166534}.bad{background:#fff1f2;color:#9f1239}.mut{color:var(--mut)}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{padding:14px 16px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><div id="login" class="login"><div class="box"><h1>VA Access</h1><p class="mut">Private owner tools. Feature controls are managed here, not by the Administrator.</p><div class="field"><label>Owner Email</label><input id="email" type="email" value="christiandavealbana92@gmail.com"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button id="loginBtn" class="btn" style="width:100%">Sign in</button><p id="msg" class="notice error hidden"></p><p><a href="index.html">← Back to portal</a></p></div></div><div id="app" class="hidden"><div class="top"><div><b>VA Control Center</b><div class="mut">Private owner access</div></div><button id="logout" class="btn s">Logout</button></div><main><div class="card"><h2>Feature Controls</h2><p class="mut">Only VA can change these. Administrator can only view unlocked/locked status.</p><div class="grid"><div><label>School</label><select id="school"></select></div><div><label>Plan</label><select id="plan"><option>BASIC</option><option>STANDARD</option><option>PREMIUM</option></select></div></div><div id="features"></div><div class="actions" style="margin-top:15px"><button id="applyPlan" class="btn s">Apply Plan Preset</button><button id="save" class="btn m">Save Feature Controls</button></div></div><div class="card"><h2>Plan Activation</h2><div class="grid"><div class="field"><label>Months</label><input id="months" type="number" min="1" max="120" value="1"></div><div class="actions" style="align-items:end"><button id="activate" class="btn m">Activate Plan</button></div></div><div id="status" class="notice">Select a school.</div></div></main></div><script>const firebaseConfig={apiKey:"AIzaSyDIm2towADazJ9yuhUaIzVfX7ZaQEFbCpI",authDomain:"jpnhs-a2ba2.firebaseapp.com",databaseURL:"https://jpnhs-a2ba2-default-rtdb.firebaseio.com",projectId:"jpnhs-a2ba2",storageBucket:"jpnhs-a2ba2.firebasestorage.app",messagingSenderId:"689552509381",appId:"1:689552509381:web:98d043fc17189a636ea3ac"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth(),OWNER='christiandavealbana92@gmail.com';const $=s=>document.querySelector(s),features=['student','teacher','registrar','pdfReportCard','attendance','coreValues','excelExport','archive','sms','parent','onlineEnrollment'];let schools={},current=null;const planFeatures=p=>{let f=Object.fromEntries(features.map(x=>[x,false]));if(p==='BASIC')Object.assign(f,{student:true,teacher:true,registrar:true,attendance:true,excelExport:true,archive:true});if(p==='STANDARD')Object.assign(f,{student:true,teacher:true,registrar:true,pdfReportCard:true,attendance:true,coreValues:true,excelExport:true,archive:true,parent:true,onlineEnrollment:true});if(p==='PREMIUM')f=Object.fromEntries(features.map(x=>[x,true]));return f};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){schools=(await db.ref('schools').once('value')).val()||{};$('#school').innerHTML=Object.entries(schools).map(([id,s])=>`<option value="${esc(id)}">${esc(s.name||id)}</option>`).join('');current=$('#school').value;render()}function render(){const s=schools[current]||{},f=s.features||{};$('#plan').value=s.plan||'STANDARD';$('#features').innerHTML=features.map(x=>`<div class="switch"><span>${esc(x.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()))}</span><input type="checkbox" data-f="${x}" ${f[x]?'checked':''}></div>`).join('');$('#status').innerHTML=`Current plan: <b>${esc(s.plan||'STANDARD')}</b><br>Expires: <b>${esc(s.expires||'Not set')}</b>`}$('#school').onchange=()=>{current=$('#school').value;render()};$('#applyPlan').onclick=()=>{const f=planFeatures($('#plan').value);document.querySelectorAll('[data-f]').forEach(x=>x.checked=!!f[x.dataset.f])};$('#save').onclick=async()=>{const f={};document.querySelectorAll('[data-f]').forEach(x=>f[x.dataset.f]=x.checked);await db.ref('schools/'+current+'/features').set(f);schools[current].features=f;alert('Feature controls saved. Administrator will now see the updated unlocked/locked status.')};$('#activate').onclick=async()=>{const s=schools[current]||{},months=Math.max(1,Number($('#months').value)||1),d=(s.expires&&new Date(s.expires)>=new Date())?new Date(s.expires):new Date();d.setMonth(d.getMonth()+months);const expires=d.toISOString().slice(0,10);await db.ref('schools/'+current).update({plan:$('#plan').value,expires,open:true});await load();alert('Plan activated until '+expires)};$('#loginBtn').onclick=async()=>{try{const email=$('#email').value.trim().toLowerCase();if(email!==OWNER)throw Error('This email is not authorized for VA access.');await auth.signInWithEmailAndPassword(email,$('#pass').value);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){$('#msg').textContent=e.message;$('#msg').classList.remove('hidden')}};$('#logout').onclick=()=>auth.signOut().then(()=>location.reload());</script></body></html>
