<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPNHS Super Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#0b5ed7;color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}header .brand{font-weight:800;font-size:19px}main{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(20,45,80,.08)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:10px 11px;border:1px solid #cdd7e5;border-radius:8px;background:white}button{border:0;border-radius:8px;padding:10px 14px;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#52647a}button.success{background:#16864a}button.danger{background:#c62828}.hide{display:none!important}.msg{padding:10px;border-radius:8px;background:#eef5ff;margin-top:10px}.error{background:#ffe8e8;color:#8a1c1c}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f1ff;color:#0b5ed7;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eff7;color:#172033}.tab.active{background:#0b5ed7;color:#fff}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border:1px solid #dbe2eb;padding:8px;text-align:left;font-size:13px}th{background:#f2f6fb} .table-wrap{overflow:auto}.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.feature{border:1px solid #dbe2eb;padding:10px;border-radius:9px}.feature input{width:auto}.login{max-width:430px;margin:70px auto}.notice{padding:12px;border-left:4px solid #0b5ed7;background:#f2f7ff}.danger-text{color:#b71c1c}.small{font-size:12px;color:#65748a}.right{text-align:right}@media(max-width:600px){main{padding:10px}.card{padding:15px}header{padding:14px}.login{margin:30px 10px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script>const FIREBASE_CONFIG={apiKey:"AIzaSyDIm2towADazJ9yuhUaIzVfX7ZaQEFbCpI",authDomain:"jpnhs-a2ba2.firebaseapp.com",databaseURL:"https://jpnhs-a2ba2-default-rtdb.firebaseio.com/",projectId:"jpnhs-a2ba2",storageBucket:"jpnhs-a2ba2.firebasestorage.app",messagingSenderId:"689552509381",appId:"1:689552509381:web:98d043fc17189a636ea3ac"};
const SCHOOL_ID="JPNHS-001", ADMIN_EMAIL="christiandavealbana92@gmail.com";
firebase.initializeApp(FIREBASE_CONFIG); const db=firebase.database(), auth=firebase.auth();
function today(){return new Date().toISOString().slice(0,10)}
async function getSchool(){return (await db.ref('schools/'+SCHOOL_ID).once('value')).val()||{name:'Juan Pamplona National High School',schoolYear:'2026-2027',gradingSystem:'4Q',plan:'STANDARD',expires:'2099-12-31',closed:false,features:{student:true,teacher:true,registrar:true,pdfReportCard:true,attendance:true,coreValues:true,excelExport:true,archive:true,sms:false,parent:false,onlineEnrollment:false}}}
function closedCheck(s){return !!s.closed || (s.expires && s.expires<today())}
function goClosed(){location.href='closed.html'}
function periods(g){return g==='4Q'?['Q1','Q2','Q3','Q4','Final']:g==='2SEM'?['SEM1','SEM2','Final']:['T1','T2','T3','Final']}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const CORE_VALUES=['Maka-Diyos: Expresses one’s spiritual beliefs while respecting the spiritual beliefs of others','Maka-Diyos: Shows adherence to ethical principles by upholding truth','Maka-Diyos: Demonstrates respect for the rights and beliefs of others','Makatao: Is sensitive to individual, social, and cultural differences','Makatao: Demonstrates contributions toward solidarity','Makatao: Respects others and their rights','Makakalikasan: Cares for the environment and utilizes resources wisely','Makakalikasan: Practices waste segregation and conservation','Makakalikasan: Participates in activities that protect the environment','Makabansa: Demonstrates pride in being a Filipino','Makabansa: Promotes the appreciation of Filipino culture and heritage','Makabansa: Contributes to the community and nation'];
const MONTHS=['June','July','August','September','October','November','December','January','February','March'];
function coreTable(values={},editable=false){return '<table><thead><tr><th>Core Value / Indicator</th><th>Rating</th></tr></thead><tbody>'+CORE_VALUES.map((v,i)=>'<tr><td>'+esc(v)+'</td><td>'+(editable?'<select data-core="'+i+'"><option value="NOT OBSERVED">NOT OBSERVED</option><option value="RARELY">RARELY</option><option value="SOMETIMES">SOMETIMES</option><option value="OFTEN">OFTEN</option><option value="ALWAYS">ALWAYS</option></select>':esc(values[i]||'NOT OBSERVED'))+'</td></tr>').join('')+'</tbody></table>'}
function attendanceTable(a={},editable=false){return '<table><thead><tr><th>Month</th><th>Present</th><th>Absent</th></tr></thead><tbody>'+MONTHS.map(m=>'<tr><td>'+m+'</td><td>'+(editable?'<input type="number" min="0" data-present="'+m+'" value="'+Number(a[m]?.present||0)+'">':Number(a[m]?.present||0))+'</td><td>'+(editable?'<input type="number" min="0" data-absent="'+m+'" value="'+Number(a[m]?.absent||0)+'">':Number(a[m]?.absent||0))+'</td></tr>').join('')+'</tbody><tfoot><tr><th>Total</th><th>'+MONTHS.reduce((n,m)=>n+Number(a[m]?.present||0),0)+'</th><th>'+MONTHS.reduce((n,m)=>n+Number(a[m]?.absent||0),0)+'</th></tr></tfoot></table>'}

const F={student:'Student Portal',teacher:'Teacher Portal',registrar:'Registrar Portal',pdfReportCard:'PDF Report Card',attendance:'Attendance Module',coreValues:'Core Values Module',excelExport:'Excel Export',archive:'Archive Portal',sms:'SMS Notification',parent:'Parent Portal',onlineEnrollment:'Online Enrollment'};const plans={BASIC:['student','teacher','registrar','attendance','excelExport','archive'],STANDARD:['student','teacher','registrar','attendance','coreValues','excelExport','archive','pdfReportCard'],PREMIUM:Object.keys(F)};let school={};
async function loginAdmin(){try{if(email.value.trim().toLowerCase()!==ADMIN_EMAIL)throw Error('Unauthorized email.');await auth.signInWithEmailAndPassword(email.value.trim(),password.value);const u=auth.currentUser;if(u.email.toLowerCase()!==ADMIN_EMAIL)throw Error('Unauthorized account.');login.classList.add('hide');app.classList.remove('hide');await load()}catch(e){loginMsg.className='msg error';loginMsg.textContent=e.message+' Create the account in Firebase Authentication first.'}}
auth.onAuthStateChanged(u=>{if(u&&u.email.toLowerCase()===ADMIN_EMAIL&&!app.classList.contains('hide'))load()});
async function load(){school=await getSchool();if(closedCheck(school)){goClosed();return}schoolName.value=school.name||'';schoolYear.value=school.schoolYear||'';gradingSystem.value=school.gradingSystem||'4Q';expires.value=school.expires||'';plan.value=school.plan||'STANDARD';renderFeatures(school.features||{});headerSchool.textContent=school.name||'JPNHS';await loadStaff()}
function renderFeatures(f){features.innerHTML=Object.entries(F).map(([k,v])=>'<label class="feature"><input type="checkbox" id="f_'+k+'" '+(f[k]?'checked':'')+'> '+v+'</label>').join('')}
function applyPlan(){const on=plans[plan.value];Object.keys(F).forEach(k=>document.getElementById('f_'+k).checked=on.includes(k))}
async function saveSettings(){await db.ref('schools/'+SCHOOL_ID).update({name:schoolName.value.trim(),schoolYear:schoolYear.value,gradingSystem:gradingSystem.value,plan:plan.value,expires:expires.value});alert('School settings saved.')}
async function saveFeatures(){const f={};Object.keys(F).forEach(k=>f[k]=document.getElementById('f_'+k).checked);await db.ref('schools/'+SCHOOL_ID+'/features').set(f);alert('Feature settings saved.')}
async function addStaff(){try{const role=staffRole.value,id=staffId.value.trim().toUpperCase(),em=staffEmail.value.trim().toLowerCase(),pw=staffPassword.value;if(!id||!staffName.value.trim()||!em||pw.length<6)throw Error('Complete all fields. Password must be at least 6 characters.');if(role==='registrars'&&!/^R-\d{4}$/.test(id))throw Error('Registrar ID must be R-0001 format.');if(role==='teachers'&&!/^T-\d{4}$/.test(id))throw Error('Teacher ID must be T-0001 format.');const existing=await db.ref('staff/'+SCHOOL_ID+'/'+role+'/'+id).once('value');if(existing.exists())throw Error('Staff ID already exists.');const secondary=firebase.initializeApp(FIREBASE_CONFIG,'staffCreator'+Date.now());const secAuth=secondary.auth();const cred=await secAuth.createUserWithEmailAndPassword(em,pw);await db.ref('staff/'+SCHOOL_ID+'/'+role+'/'+id).set({id,name:staffName.value.trim(),email:em,role:role==='registrars'?'registrar':'teacher',schoolId:SCHOOL_ID,uid:cred.user.uid,active:true,createdAt:firebase.database.ServerValue.TIMESTAMP});await secAuth.signOut();await secondary.delete();staffMsg.className='msg';staffMsg.textContent='Account created successfully.';['staffId','staffName','staffEmail','staffPassword'].forEach(x=>document.getElementById(x).value='');await loadStaff()}catch(e){staffMsg.className='msg error';staffMsg.textContent=e.message}}
async function loadStaff(){const snap=await db.ref('staff/'+SCHOOL_ID).once('value'),root=snap.val()||{},rows=[];for(const role of ['registrars','teachers'])for(const [id,s] of Object.entries(root[role]||{}))rows.push({...s,id,role});staffTable.querySelector('tbody').innerHTML=rows.map(s=>'<tr><td>'+esc(s.id)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.email)+'</td><td>'+esc(s.role)+'</td><td>'+ (s.active!==false?'Active':'Blocked')+'</td><td><button class="'+(s.active!==false?'danger':'success')+'" onclick="toggleStaff(\''+esc(s.role==='teacher'?'teachers':'registrars')+'\',\''+esc(s.id)+'\','+(s.active!==false)+')">'+(s.active!==false?'Block':'Activate')+'</button></td></tr>').join('')}
async function toggleStaff(role,id,isActive){await db.ref('staff/'+SCHOOL_ID+'/'+role+'/'+id+'/active').set(!isActive);await loadStaff()}
async function setClosed(v){await db.ref('schools/'+SCHOOL_ID+'/closed').set(v);portalMsg.className='msg';portalMsg.textContent=v?'Portal closed.':'Portal opened.'}
async function exportAll(){const root=(await db.ref('students/'+SCHOOL_ID).once('value')).val()||{},rows=Object.values(root).map(s=>({StudentID:s.studentId,SchoolID:s.schoolId,SchoolYear:s.schoolYear,Name:s.name,Level:s.level,Section:s.section,Address:s.address,Birthday:s.birthday,Guardian:s.guardian,GradingSystem:s.gradingSystem,Grades:JSON.stringify(s.grades||{}),CoreValues:JSON.stringify(s.coreValues||{}),Attendance:JSON.stringify(s.attendance||{})}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Students');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{SchoolID:SCHOOL_ID,SchoolName:school.name,SchoolYear:school.schoolYear,GradingSystem:school.gradingSystem}]),'Settings');XLSX.writeFile(wb,'JPNHS-FULL-BACKUP-'+school.schoolYear+'.xlsx')}</script></head><body><div id="login" class="card login"><h2>JPNHS Super Admin</h2><p class="small">Authorized Super Admin email</p><input id="email" value="christiandavealbana92@gmail.com"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="loginAdmin()">Sign In</button><div id="loginMsg"></div></div><div id="app" class="hide"><header><div><div class="brand" id="headerSchool">JPNHS</div><div>Super Admin Control Panel</div></div><button class="secondary" onclick="auth.signOut().then(()=>location.reload())">Sign Out</button></header><main><div class="card"><h2>School Settings</h2><div class="grid"><div><label>School Name</label><input id="schoolName"></div><div><label>School Year</label><input id="schoolYear"></div><div><label>Grading System</label><select id="gradingSystem"><option>4Q</option><option>2SEM</option><option>3TRIM</option></select></div><div><label>Portal Expiration</label><input id="expires" type="date"></div></div><button onclick="saveSettings()">Save Settings</button></div><div class="card"><h2>Plan & Feature Controls</h2><select id="plan" onchange="applyPlan()"><option value="BASIC">BASIC — ₱15,000/year</option><option value="STANDARD">STANDARD — ₱30,000/year</option><option value="PREMIUM">PREMIUM — ₱50,000/year</option></select><div id="features" class="feature-grid" style="margin-top:12px"></div><button onclick="saveFeatures()">Save Features</button></div><div class="card"><h2>Staff Management</h2><div class="grid"><div><label>Role</label><select id="staffRole"><option value="registrars">Registrar</option><option value="teachers">Teacher</option></select></div><div><label>Staff ID</label><input id="staffId" placeholder="R-0001 or T-0001"></div><div><label>Full Name</label><input id="staffName"></div><div><label>Email</label><input id="staffEmail" type="email"></div><div><label>Temporary Password</label><input id="staffPassword" type="password"></div></div><button onclick="addStaff()">Add Staff Account</button><div id="staffMsg"></div><div class="table-wrap"><table id="staffTable"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></div></div><div class="card"><h2>Data & Portal</h2><button onclick="exportAll()">Export ALL Data to Excel</button><button class="danger" onclick="setClosed(true)">Close Portal</button><button class="success" onclick="setClosed(false)">Open Portal</button><div id="portalMsg"></div></div></main></div></body></html>
