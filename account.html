<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create School Portal Account</title>
<style>:root{--b:#0757a5;--b2:#0b74d1;--ink:#132238;--mut:#65758b;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:linear-gradient(135deg,#edf5ff,#fff);color:var(--ink);min-height:100vh}.wrap{width:min(520px,calc(100% - 28px));margin:40px auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 15px 50px #15365d18}.logo{width:52px;height:52px;border-radius:13px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:900}.mut{color:var(--mut)}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #ccd8e6;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;width:100%}.soft{background:#eef4fa;color:#1e4f7f}.notice{padding:11px;border-radius:9px;background:#eef7ff;border:1px solid #cfe4f8}.error{background:#fff0f0;border-color:#efb7b7;color:#8d2020}.hidden{display:none}.links{display:flex;gap:8px;margin-top:12px}.links a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:9px;background:#eef4fa;color:#1e4f7f;font-weight:700;font-size:13px}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="portal-data.js?v=1"></script><script src="portal-auth.js?v=5"></script></head><body><div class="wrap"><div class="card"><div class="logo">SP</div><h1>Create your School Portal account</h1><p class="mut">Your school must register your student or staff record first. This creates a secure Firebase login for that existing record; it does not create a duplicate school record.</p><div class="field"><label>Account type</label><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></div><div class="field"><label>Student/Teacher ID</label><input id="rid" autocomplete="username" placeholder="Enter your registered ID"></div><div class="field" id="verifyBox"><label>Student birthday (verification)</label><input id="verify" type="date"></div><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div><div class="field"><label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"></div><button class="btn" id="create">Create account</button><p id="msg" class="notice hidden"></p><div class="links"><a id="homeLink" href="index.html">School Home</a><a id="portal" href="student.html">Student Login</a></div></div></div><script>
const $=id=>document.getElementById(id); const SCHOOL_ID=(new URLSearchParams(location.search).get('school')||'').trim();
function wireSchoolLinks(){document.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href')||'';if(!SCHOOL_ID||h.startsWith('http')||h.startsWith('#'))return;if(/^(index|student|teacher|registrar|admin|closed)\.html/.test(h)&&!h.includes('school='))a.href=h+(h.includes('?')?'&':'?')+'school='+encodeURIComponent(SCHOOL_ID);});} function msg(t,e=false){$('msg').textContent=t;$('msg').className='notice '+(e?'error':'');$('msg').classList.remove('hidden')}
if(!SCHOOL_ID) msg('School ID is missing. Open this portal with ?school=312422.',true); $('role').value=new URLSearchParams(location.search).get('role')==='teacher'?'teacher':'student';wireSchoolLinks(); $('role').onchange=()=>{$('verifyBox').style.display=$('role').value==='student'?'block':'none';$('portal').href=$('role').value==='student'?'student.html':'teacher.html'};
$('create').onclick=async()=>{try{let role=$('role').value,id=$('rid').value.trim(),email=$('email').value.trim(),p=$('pw').value;if(p!==$('pw2').value)throw Error('Passwords do not match.');if(p.length<8)throw Error('Password must be at least 8 characters.');await PortalAuth.createAccount({role,recordId:id,email,password:p,verify:$('verify').value});msg('Account created successfully. You can now use this email/password on your school portal.');setTimeout(()=>location.href=(role==='student'?'student.html':'teacher.html')+'?school='+encodeURIComponent(SCHOOL_ID),700)}catch(e){console.error(e);msg(e.message||'Unable to create account.',true)}};
if(SCHOOL_ID){$('homeLink').href='index.html?school='+encodeURIComponent(SCHOOL_ID);$('portal').href=($('role').value==='student'?'student.html':'teacher.html')+'?school='+encodeURIComponent(SCHOOL_ID);}
</script><script id="firebaseSchoolSelector">(function(){
 const sid=(new URLSearchParams(location.search).get('school')||'').trim();
 if(sid)return;
 document.addEventListener('DOMContentLoaded',function(){
  if(document.getElementById('schoolSelector'))return;
  const d=document.createElement('div');d.id='schoolSelector';d.style.cssText='position:fixed;inset:0;background:rgba(7,32,64,.72);z-index:99999;display:grid;place-items:center;padding:20px';
  d.innerHTML='<div style="background:#fff;max-width:430px;width:100%;padding:25px;border-radius:18px;box-shadow:0 20px 70px #0004;font-family:Arial"><h2 style="margin-top:0">Enter School ID</h2><p style="color:#65758b">Enter the School ID registered in Firebase. This is not saved on this device.</p><input id="firebaseSchoolIdInput" placeholder="e.g. 312422" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8e6;border-radius:9px"><button id="firebaseSchoolIdGo" style="width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#0757a5;color:#fff;font-weight:800;cursor:pointer">Continue</button><p id="firebaseSchoolIdErr" style="color:#b42318;font-size:13px"></p></div>';
  document.body.appendChild(d);const input=document.getElementById('firebaseSchoolIdInput');input.focus();
  document.getElementById('firebaseSchoolIdGo').onclick=async function(){const id=input.value.trim();if(!id){document.getElementById('firebaseSchoolIdErr').textContent='Enter a School ID.';return}if(window.firebase&&firebase.database){try{const snap=await firebase.database().ref('schools/'+id).once('value');if(!snap.exists()){document.getElementById('firebaseSchoolIdErr').textContent='That School ID is not registered in Firebase.';return}}catch(e){document.getElementById('firebaseSchoolIdErr').textContent=e.message||'Unable to check Firebase.';return}}const u=new URL(location.href);u.searchParams.set('school',id);location.href=u.href;};
 });
})();</script></body></html>
